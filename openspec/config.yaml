schema: spec-driven

# OpenSpec is change governance for Nazm, nothing more (docs/internal/change-governance.md).
# It records proposed and in-flight changes. It is not the authority for current Nazm semantics
# or implementation status: docs/user/spec.md, docs/internal/master-architecture.md, docs/internal/architecture.md,
# docs/user/stability.md, docs/internal/capability-matrix.md and docs/user/limitations.md are, and an accepted
# change updates them before it is archived.
context: |
  Nazm: a programming language and toolchain. Rust workspace under crates/, a compiler written in
  Nazm under compiler/, the standard library under library/.
  Authorities, in order: docs/internal/capability-matrix.md (status and evidence), docs/user/spec.md
  (semantics), docs/internal/master-architecture.md (laws), docs/user/stability.md (compatibility),
  docs/internal/runbook.md (operations), docs/user/limitations.md (boundaries). Goals are ambition only.
  A delta spec states observable requirements and cites the authority section it changes; it
  never restates the language specification. Changes to language or toolchain behaviour archive
  with --skip-specs: their normative text lives in the authorities. openspec/specs/ holds only
  repository-process capabilities.
  Heavy work runs only through `cargo xtask contained`. An agent may push a branch and open a
  pull request; `main` only with a green `nazm-gate` receipt for that commit (the copyright
  holder's decision, 2026-10-25). Nothing is ever tagged or published by an agent.
  Use OpenSpec with DO_NOT_TRACK=1 (no telemetry).

rules:
  proposal:
    - Name the Nazm authority sections the change touches.
    - Say whether it moves the semantic epoch, the runtime ABI, a schema or the std API.
  design:
    - Record the existing mechanism considered and why it is not enough.
  tasks:
    - End with updating the authoritative docs and the capability matrix, then evidence.
