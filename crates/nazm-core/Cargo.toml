[package]
name = "nazm-core"
description = "Type checking, the one lowering to Core IR, and evaluation."
version.workspace = true
edition.workspace = true
# Not `workspace = true` (R1d): the interpreter's `os_lock`, `os_try_lock` and `os_unlock` are
# `std::fs::File::lock` and its kin, stabilised in 1.89 — the only advisory lock a crate that
# forbids `unsafe` can take. The workspace floor (1.85) stays the other crates'.
rust-version = "1.89"
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.nazm]
# The sections that are this package's authority, as N32 identifies them (N33).
docs = ["spec", "architecture:5", "architecture:7.41"]

[dependencies]
nazm-span = { workspace = true }
nazm-diag = { workspace = true }
nazm-syntax = { workspace = true }
nazm-sema = { workspace = true }
# Core IR: what checking lowers a program to, and what the interpreter runs (N39).
nazm-cir = { workspace = true }

[lints]
workspace = true
