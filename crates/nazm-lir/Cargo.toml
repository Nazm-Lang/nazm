[package]
name = "nazm-lir"
description = "MIR laid out and emitted as the LLVM IR text a backend reads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.nazm]
# The sections that are this package's authority, as N32 identifies them (N33).
docs = ["architecture:2", "architecture:7.5", "architecture:7.42"]

[dependencies]
nazm-span = { workspace = true }
nazm-diag = { workspace = true }
nazm-sema = { workspace = true }
# What it lowers (N40): validated MIR. Not Core IR and not `nazm-syntax`: the backend never
# sees how a program was written, and makes no language decision MIR has already made.
nazm-mir = { workspace = true }

[lints]
workspace = true
