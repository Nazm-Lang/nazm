[package]
name = "nazm-service"
description = "The compiler's driver library: source roots, module loading from disk or open buffers, and the long-lived language service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.nazm]
# The sections that are this package's authority, as N32 identifies them (N33).
docs = ["architecture:7.18", "architecture:7.29", "architecture:7.30", "architecture:7.32"]

[dependencies]
nazm-span = { workspace = true }
nazm-diag = { workspace = true }
nazm-core = { workspace = true }
# Packages (N46): a build whose source root is a package's resolves its dependencies.
nazm-package = { workspace = true }
# The context packet's one serialisation, `nazm.context/1` (N27).
serde = { workspace = true }
serde_json = { workspace = true }
# The semantic snapshot's section digests, `nazm.snapshot/1` (N28): the workspace's one hash.
blake3 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
