[package]
name = "nazm-span"
description = "Source files, byte spans, and line/column resolution."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# No dependencies, and `serde` in particular. A span is only meaningful together with the
# file it names, so publishing one is a decision a wire format's owner makes explicitly
# rather than something a derive does on its way past. See the crate documentation.

[package.metadata.nazm]
# The sections that are this package's authority, as N32 identifies them (N33).
docs = ["architecture:7.1"]

[lints]
workspace = true
