[package]
name = "nazm-tokens"
description = "Tokenizer-independent measurement of text: bytes, scalars, lines and exact token counts under pinned, offline tokenizers of three families (N34). A tool beside the compiler; nothing that ships depends on it."
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.nazm]
# The sections that are this package's authority, as N32 identifies them (N33).
docs = ["architecture:7.36", "performance"]

[[bin]]
name = "nazm-tokens"
path = "src/main.rs"

[dependencies]
# OpenAI's byte-level BPE, cl100k_base and o200k_base, with their rank files bundled in the
# crate. Pinned exactly: a count is only evidence under the exact vocabulary.
tiktoken-rs = "=0.12.1"
# Hugging Face's tokenizer implementation, for the SentencePiece BPE and Unigram files in
# `tools/tokenizers/`. No default features: no HTTP, no download, no progress bar, no C
# regex engine — `fancy-regex` is the pure-Rust one.
tokenizers = { version = "=0.23.1", default-features = false, features = ["fancy-regex"] }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
# The N33 scenarios, measured again under tokens (tests/benchmark.rs).
nazm-repo = { workspace = true }
nazm-docs = { workspace = true }
nazm-service = { workspace = true }
nazm-core = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
