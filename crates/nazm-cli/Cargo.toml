[package]
name = "nazm-cli"
description = "The `nazm` command."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.nazm]
# The sections that are this package's authority, as N32 identifies them (N33).
docs = ["guide", "diagnostics:the-exit-statuses"]

[[bin]]
name = "nazm"
path = "src/main.rs"

[dependencies]
nazm-span = { workspace = true }
nazm-diag = { workspace = true }
nazm-core = { workspace = true }
nazm-iface = { workspace = true }
# What checking depends on, and the store of results keyed on it. The driver is where the
# two halves meet: `nazm-core` decides what a module means, this decides whether the
# question has already been answered, and neither knows about the other.
nazm-cache = { workspace = true }
nazm-lir = { workspace = true }
# MIR (N40): what `nazm build` lowers Core IR to, and what `nazm mir` prints.
nazm-mir = { workspace = true }
# Source roots and module loading, shared with the language service so the two cannot
# disagree about which files a compilation has (N16).
nazm-service = { workspace = true }
clap = { workspace = true }
# `nazm fix` and `nazm capabilities` emit machine-readable output under their own
# versioned schemas, the same way diagnostics do.
serde = { workspace = true }
serde_json = { workspace = true }
# `nazm lsp`: the protocol shell over `nazm-service`. Framing and message types only.
lsp-server = { workspace = true }
lsp-types = { workspace = true }
# `nazm docs`: Nazm's own documentation by section (N32). Reads files; no compiler.
nazm-docs = { workspace = true }
# `nazm repo`: the repository map and the minimum task context (N33).
nazm-repo = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# `tests/durable_identity.rs` checks a module against a **deserialised** interface, which
# needs the span vocabulary the checker speaks.
nazm-span = { workspace = true }
# `tests/schemas.rs` validates real command output against `schema/*.json`.
nazm-diag = { workspace = true }
# Each build case needs a throwaway directory for its source, its executable and, in two
# cases, a stub toolchain on PATH.
tempfile = { workspace = true }

[lints]
workspace = true
