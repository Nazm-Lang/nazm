# The gate `cargo lint` and the README claim to mirror.
#
# Until this file existed, both of them described a CI that did not exist — `.cargo/
# config.toml` said "mirrors the CI gate exactly" and the README said the same, and there
# was nothing on the other side of the comparison.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    # Linux on purpose, and not only for cost. Some behaviour cannot be exercised on
    # macOS at all: APFS refuses to create a filename that is not valid UTF-8, so the
    # end-to-end test for that refusal can only run on a filesystem that permits the
    # name. `NAZM_REQUIRE_NONUTF8` below turns that test's skip into a failure, so the
    # coverage is enforced here rather than left to whoever happens to read stderr.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Matches rust-toolchain.toml. Pinned because cranelift 0.135 declares MSRV
          # 1.95.0, so the eventual backend could not build on anything older.
          toolchain: "1.98.1"
          components: clippy, rustfmt

      - name: fmt
        run: cargo fmt --all -- --check

      - name: lint
        run: cargo lint

      - name: test
        env:
          NAZM_REQUIRE_NONUTF8: "1"
        run: cargo test --workspace --locked

      # `cargo test` does not run these: they drive nested cargo builds and kill real
      # process groups, and `cargo xtask mutate` below would pay their cost 79 times
      # over. Ignored by default and run here, so they are executed rather than merely
      # present.
      - name: mutation-runner lifecycle
        run: cargo test -p xtask --test lifecycle -- --ignored --test-threads=1

      - name: project checks
        run: cargo xtask check

      - name: accounting selftest
        run: cargo run -p nazm-bench -- selftest

      # Last: it injects every catalogued defect in turn and is far slower than the rest.
      # A failure here means a defect the suite no longer detects.
      - name: mutation coverage
        run: cargo xtask mutate
