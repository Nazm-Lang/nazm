find = "program = { use_item }"
replace = "program = { use_itemz }"

[[mutation]]
name = "corpus-grammar-detached-comment"
why = "docs corpus: a comment a blank line separates from every rule"
file = "docs/grammar.ebnf"
find = "program = { use_item }"
replace = "(* a stray comment *)\n\nprogram = { use_item }"

[[mutation]]
name = "corpus-unclosed-fence"
why = "docs corpus: a code fence that never closes"
file = "docs/roadmap.md"
find = "which is the argument for doing the small thing first.\n"
replace = "which is the argument for doing the small thing first.\n\n```text\nnever closed\n"

[[mutation]]
name = "corpus-headings-the-reader-refuses"
why = "docs corpus: a misplaced anchor, a heading with no identity, a setext heading, an HTML heading"
file = "docs/roadmap.md"
find = "which is the argument for doing the small thing first.\n"
replace = "which is the argument for doing the small thing first.\n\n<!-- id: stray -->\n\n## — · —\n\nA paragraph\n===\n\n<h2>Old style</h2>\n"

[[mutation]]
name = "corpus-no-title"
why = "docs corpus: a document that does not open with its title"
file = "docs/bootstrap.md"
find = "# The bootstrap: how it was designed, what it does, and what it establishes\n"
replace = "The bootstrap\n\n# The bootstrap: how it was designed, what it does, and what it establishes\n"

[[mutation]]
name = "corpus-numbered-and-lettered-headings"
