# Nazm — an AI-native programming language.
#
# Constitution: docs/internal/master-architecture.md · What exists: docs/internal/capability-matrix.md
# Roadmap: docs/user/roadmap.md · Long-term goals: docs/internal/NAZM_LANGUAGE_GOALS.md
# Design record: docs/internal/architecture.md · Spec: docs/user/spec.md
# Evaluation protocol (draft, not pre-registered): docs/internal/research/evaluation.md
#
# Two tracks in one workspace. The language — span, diag, syntax, sema, cir, core, lir, cli —
# is an interpreter and a native compiler: lexer, parser, checker, one lowering to Core IR
# (nazm-cir) that an evaluator runs and nazm-lir lowers, and one backend (LLVM IR as text,
# assembled by clang). Two IR levels, Core IR since N39. `nazm-sema`
# holds what a program *means* — types, built-ins, modules, interfaces, resolution — and
# depends on spans and nothing else. Alongside them, nazm-bench, an agent-cost harness that
# now measures specific claims rather than gating the project's existence.
#
# Corrected twice, and both are left visible because a header is where a stale claim does
# the most damage. It read "there is deliberately no compiler here yet" until 2026-09-20,
# when a .nz program first executed. It then read that the language had "no IR and no
# backend" until 2026-09-21 — by which time nazm-lir was a workspace member listed eight
# lines below, and the compiler had compiled itself. `cargo xtask check` now fails on that
# sentence rather than waiting for a reader to notice it.

[workspace]
resolver = "2"
members = [
    "crates/nazm-span",
    "crates/nazm-diag",
    "crates/nazm-syntax",
    "crates/nazm-sema",
    "crates/nazm-iface",
    "crates/nazm-cache",
    "crates/nazm-cir",
    "crates/nazm-core",
    "crates/nazm-lir",
    "crates/nazm-runtime",
    "crates/nazm-formal",
    "crates/nazm-mir",
    "crates/nazm-codegen-clif",
    "crates/nazm-codegen-nazm",
    "crates/nazm-package",
    "crates/nazm-service",
    "crates/nazm-docs",
    "crates/nazm-repo",
    "crates/nazm-tokens",
    "crates/nazm-agent-bench",
    "crates/nazm-cli",
    "crates/nazm-mcp",
    "crates/nazm-bench",
    "xtask",
]

[workspace.package]
version = "0.10.0"
edition = "2021"
# Pinned toolchain is 1.98.1 (see rust-toolchain.toml). This floor is lower on
# purpose: it is the oldest compiler the *shipped* crates actually need, and CI
# verifies the claim rather than trusting it. The floor will rise to 1.95+ when
# cranelift arrives in Stage 7 — at which point this line is the thing that has
# to change deliberately.
#
# xtask overrides it with 1.89: it needs std's file locking, and a development
# tool's requirement has no business raising the floor for the crates that ship.
rust-version = "1.89"
license = "Apache-2.0 WITH LLVM-exception"
repository = "https://github.com/Nazm-Lang/nazm"
homepage = "https://nazm.dev"
authors = ["Md Ferdous Alam <mdferdousalam1989@yahoo.com>", "Nazm contributors"]
publish = false

# ---------------------------------------------------------------------------
# Shared dependency versions.
#
# Phase 2 only. The compiler stack (salsa, cstree, cranelift, redb, blake3,
# postcard) is listed in docs/internal/architecture.md with its MSRVs checked, and each
# is depended on only once the crate that needs it exists: adding a dependency
# before then is how a workspace acquires a build it cannot explain. blake3
# arrived with the cache, cstree with the lossless syntax tree (N15).
# ---------------------------------------------------------------------------
[workspace.dependencies]
# --- internal ---
# Path-only, no version: nothing here is published (`publish = false` above), and
# a version string on an unpublishable crate is decoration that cargo-deny would
# rightly flag as a wildcard once publishing starts.
nazm-span = { path = "crates/nazm-span" }
nazm-diag = { path = "crates/nazm-diag" }
nazm-syntax = { path = "crates/nazm-syntax" }
nazm-sema = { path = "crates/nazm-sema" }
nazm-iface = { path = "crates/nazm-iface" }
nazm-cache = { path = "crates/nazm-cache" }
nazm-cir = { path = "crates/nazm-cir" }
nazm-core = { path = "crates/nazm-core" }
nazm-lir = { path = "crates/nazm-lir" }
nazm-runtime = { path = "crates/nazm-runtime" }
nazm-mir = { path = "crates/nazm-mir" }
nazm-codegen-clif = { path = "crates/nazm-codegen-clif" }
nazm-codegen-nazm = { path = "crates/nazm-codegen-nazm" }
nazm-package = { path = "crates/nazm-package" }
nazm-service = { path = "crates/nazm-service" }
nazm-docs = { path = "crates/nazm-docs" }
nazm-repo = { path = "crates/nazm-repo" }
nazm-bench = { path = "crates/nazm-bench" }

# --- cli / config ---
clap = { version = "4", features = ["derive", "env"] }
toml = "1"

# --- serialization ---
# Every run record is JSON: the analysis (mixed-effects models, per §5 of the plan)
# happens in R or Python, not here. Rust's job is to produce records that are
# complete, ordered, and impossible to silently lose.
serde = { version = "1", features = ["derive"] }
# The fingerprint over a module's persisted interface. `architecture.md` §8 records BLAKE3
# as this project's choice and says why: it keeps the bootstrap chain free of C
# dependencies. `default-features = false` is what makes that true — the default build
# uses `cc` for SIMD, and the pure-Rust path costs three transitive crates
# (`arrayref`, `arrayvec`, `constant_time_eq`) and no toolchain. A non-cryptographic
# checksum is not an option: an accidental collision in a durable semantic fingerprint is
# an invalid cache hit, which is a miscompilation with a plausible explanation.
blake3 = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
# --- syntax ---
# The lossless concrete syntax tree, N15. Pinned exactly: a green tree's layout and its
# interner are what `nazm-syntax` wraps, and a minor version is allowed to change both.
# `default-features = false` keeps it to `std` — no `derive` proc macro, no `lasso`, no
# `serde`. `architecture.md` §8 records why `cstree` rather than `rowan`.
cstree = { version = "=0.14.0", default-features = false, features = ["std"] }
# --- editor protocol ---
# `nazm lsp`, N16. `lsp-server` is rust-analyzer's synchronous JSON-RPC transport over
# stdio — framing, requests, responses, the initialize and shutdown handshakes — and owns
# nothing about what a program means. `lsp-types` is the protocol's message types. Both
# pinned exactly: a protocol crate's minor version is allowed to change its types.
lsp-server = "=0.10.0"
lsp-types = "=0.97.0"
# `nazm-mcp`, N27: the official Rust SDK for the Model Context Protocol — framing,
# `initialize`, `tools/list`, `tools/call`, version negotiation — and the runtime it runs
# on. Only in that crate, so the compiler binary carries neither. Pinned exactly, as the
# editor protocol crates are; no default features, so no HTTP, no OAuth, no macros.
rmcp = { version = "=3.4.1", default-features = false }
tokio = { version = "1", default-features = false }
# Preserves insertion order. Run records are diffed and reviewed by hand; map
# iteration order leaking into output would make every diff noise.
indexmap = { version = "2", features = ["serde"] }

# --- process / fs ---
# Each attempt runs in its own tree. Reuse is how state leaks between attempts,
# which is a failure mode the harness is explicitly tested against.
tempfile = "3"

# --- errors / logging ---
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- time ---
# Run records are timestamped in UTC. Local time in an experimental record is a
# defect: runs get compared across machines.
jiff = { version = "0.2", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
# A measurement instrument that silently drops a field is worse than one that
# fails. Unused results here are usually a dropped record.
unused_must_use = "deny"

[workspace.lints.clippy]
# The harness computes the numbers the whole project is judged on. A panic in
# analysis code is a lost run; a silent truncation is a wrong answer that looks
# like a right one.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
integer_division = "warn"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
float_cmp = "warn"
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
overflow-checks = true

[profile.dev]
overflow-checks = true
# Line tables are enough for a backtrace; full debug info made linking the many test
# executables most of a test run.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
