# The performance claims register (N92, docs/architecture.md §7.93).
#
# One entry per measured section of docs/performance.md, by its exact heading. `cargo xtask check`
# (performance claims) refuses a measured heading with no entry, an entry for no heading, and a
# reproducible entry whose command is not in the tree. It does not run the commands.
#
#   reproducible  `how` regenerates the numbers; `metric` is what it prints
#   dated         a record of the tree on its date; `why` says so
#   unreproduced  a current claim no command regenerates; `why` says what is missing

