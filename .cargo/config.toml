[alias]
xtask = "run --package xtask --"
# Mirrors the CI gate exactly: `.github/workflows/ci.yml` runs this alias rather than
# spelling the flags out again, so the two cannot drift. Until that workflow existed this
# comment described a comparison with nothing on the other side of it.
lint = "clippy --workspace --all-targets --locked -- -D warnings"

# Every test and every program cargo starts reads `main`'s result as the result report prints it
# (R1, 5b.3): the tests compare that value, and a test of the default — the result as the exit
# status — removes the variable for its own run. `crates/nazm-runtime/src/core.rs`, `RESULT_VARIABLE`.
[env]
NAZM_RESULT_REPORT = "1"
# The user cache (R1.5, D12) is off for every test and program cargo starts, so no test writes to the
# real `~/Library/Caches/nazm` or `~/.cache/nazm`; a test of the user cache names a temporary one.
# `crates/nazm-cli/src/derived.rs`, `USER_CACHE_DIR`.
NAZM_USER_CACHE_DIR = ""
