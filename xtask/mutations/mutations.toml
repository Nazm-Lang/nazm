# --- N10: enums and pattern matching ----------------------------------------------------
#
# What only a sum type can get wrong, which is everything that turns on *which fields
# exist being a runtime fact*: coverage, the discriminant, and releasing the arm the value
# is actually in.

[[mutation]]
name = "a-match-need-not-cover-every-variant"
why = """
stops reporting the variants a `match` leaves out, so a closed enum silently becomes an
open one: a program compiles with a variant it has no arm for, and reaches a `switch` whose
default was only ever a structural requirement. `docs/spec.md` gives the checker the
language's meaning precisely so that this cannot be deferred to the backend
"""
file = "crates/nazm-core/src/check.rs"
find = "        if !missing.is_empty() && !unresolved {"
replace = "        if false {"

[[mutation]]
name = "a-variant-may-have-two-arms"
why = """
accepts a second arm for a variant the `match` already covers. The discriminant selects
exactly one, so the later arm can never run — and coverage now counts an arm that is dead
towards a variant that is uncovered, which is how a non-exhaustive match passes the check
"""
file = "crates/nazm-core/src/check.rs"
find = """            if let Some(Some(first)) = covered.get(at as usize).copied() {"""
replace = """            if let Some(None) = covered.get(at as usize).copied() {
                let _ = arm.variant_span;
            }
            if let Some(Some(first)) = None::<Option<Span>> {"""

[[mutation]]
name = "a-pattern-may-name-another-enums-variant"
why = """
stops checking that a pattern's enum is the scrutinee's, so `B.Ready(…)` matches an `A`
whenever both happen to have a `Ready`. Nominality is the whole of what makes two
identically shaped enums two types, and structural matching would undo it silently — the
arm would bind payload fields of a variant the value does not have
"""
file = "crates/nazm-core/src/check.rs"
find = "            if self.res.types().definition_of(sty) != Some(TypeNode::Enum(named)) {"
replace = "            if false {"

[[mutation]]
name = "a-pattern-need-not-name-every-payload-field"
why = """
lets a pattern leave a payload field out. The rule exists for evolution: adding a field
must break the patterns that did not know about it rather than letting them ignore new
state, and this is exactly the silence it was written to prevent
"""
file = "crates/nazm-core/src/check.rs"
find = """        let missing = self.missing_payload_fields(id, at, &named);
        if !missing.is_empty() {"""
replace = """        let missing = self.missing_payload_fields(id, at, &named);
        if false {"""

[[mutation]]
name = "a-public-enum-may-leak-a-private-payload-type"
why = """
stops checking an exported enum's payload types, so a module publishes a variant whose
payload an importer must name to match it and cannot. The closure has to run through both
