# `snapshot-skips-the-production-mode-readback` is deliberately absent, and this is the
# reason rather than an oversight.
#
# Removing the `mode_matches(...)` call from `walk_tree` only has an effect when a
# filesystem silently refuses permission bits, and every mode that could expose it —
# 4755, 2755, 1755, 7777, 0000, 0400 — was preserved on the filesystems available here
# when measured. So the mutation would survive today.
#
# That is a statement about what can be exercised here, not about what is possible:
# injecting the fault — a FUSE mount that drops setuid, a seam that fakes the read-back —
# would exercise it, and is the way to cover this later. It is left out of the runnable
# catalogue for now rather than added as a guaranteed survivor.
#
# What is covered: `mode_matches` itself, by unit tests including the setuid case; and
# the fact that the production path calls it at all, indirectly — `snapshot-copies-with-
# the-umask` removes `set_permissions`, which makes the read-back's comparison fail, so
# that mutation is caught *by* the read-back running in production.
#
# What is not covered: removing the call while `set_permissions` still succeeds. Recorded
# as uncovered, alongside `checking-runs-on-the-callers-stack`.

# ---------------------------------------------------------------------------
# The native backend. Added with M1b; each verified individually through a
# single-entry run in a disposable copy of the checkout, not by a catalogue run.
# ---------------------------------------------------------------------------

[[mutation]]
name = "checked-add-loses-its-sign"
why = """
`docs/spec.md` says overflow traps. The emitter detects it with
`llvm.sadd.with.overflow.i64`; the unsigned intrinsic is one letter away and is the
mistake a reader would not see. `Int::MAX + 1` does not carry as an unsigned addition, so
the guard never fires and the program prints the wrapped value instead of stopping —
silently wrong arithmetic in a language whose first promise is that it traps.

Caught by `addition_overflow_traps`, which requires exit 2 AND the N0400 code AND the
message. Exit status alone would not discriminate: a mutant that died on a signal would
also be non-zero.
"""
file = "crates/nazm-lir/src/emit.rs"
find = 'ArithOp::Add => "sadd",'
replace = 'ArithOp::Add => "uadd",'

[[mutation]]
name = "the-statement-conditional-selects-the-wrong-branch"
why = """
Swaps the arms of a statement-position `if`, so `if c { a } else { b }` runs `b` when `c`
holds. Nothing structural notices: both labels exist, both blocks have terminators, and
clang accepts the module — the program simply does the other thing.

Split from a single `the-conditional-selects-the-wrong-branch` entry at final
integration. That entry's pattern was the `br i1` line alone, which occurs in **two**
functions — `statement_if` and `conditional` — so the runner refused it as not unique
and the mutation had stopped applying at all. A pattern that matches twice proves
