# effects reach its caller and a cycle reaches its fixed point, a contract holds its body, an
# unknown or repeated name is refused, an undeclared import promises nothing, the witness points at
# the call that needs the effect, the interface carries and returns the declared set, a snapshot and
# a packet say what the checker knows, and the epoch and the interface schema moved.

