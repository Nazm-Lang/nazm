[[mutation]]
name = "selfhost-a-diverging-block-expression-is-unit"
why = """
the **Nazm-written** checker treats a block expression that always leaves as producing nothing, so a `match` whose arms all return is refused as having no value
"""
file = "compiler/analyse.nz"
find = """            if kind == n_blockexpr() {
                ints_set(ncomp, k, ints_get(ncomp, ints_get(kids, first)));"""
replace = """            if kind == n_blockexpr() {
                ints_set(ncomp, k, ints_get(ncomp, ints_get(kids, first)));
                if ints_get(ncomp, k) == c_diverges() { ints_set(ncomp, k, c_unit()); }"""
killers = [{ package = "nazm-cli", test = "selfhost", name = "the_nazm_checker_agrees_with_the_reference_on_value_blocks" }]

[[mutation]]
name = "selfhost-a-block-expression-is-emitted-as-something"
why = """
the **Nazm-written** emitter stops treating a block expression as structure, so the node falls through to the emitters of other kinds
"""
file = "compiler/emit.nz"
