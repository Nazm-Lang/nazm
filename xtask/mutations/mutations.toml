# --- the language itself ------------------------------------------------------------
#
# The harness mutations above cover the benchmark's accounting. These cover the
# interpreter, where a silent defect is worse: it changes what programs mean.

[[mutation]]
name = "call-depth-unbounded"
why = """
removes the recursion guard, so runaway recursion exhausts the host stack and kills the
process with no diagnostic — the one failure a tool cannot explain to anyone
"""
file = "crates/nazm-core/src/eval.rs"
find = "                if self.depth > self.max_depth {"
replace = "                if false {"

[[mutation]]
name = "call-depth-never-released"
why = """
leaves the counter raised after a call returns, so a long sequence of sibling calls hits
the depth limit although nothing is nested
Repointed by N39: the interpreter walks Core IR, and a call is `ExprKind::Call` there.
"""
file = "crates/nazm-core/src/eval.rs"
find = """                let out = self.call_body(g, frame(g, values));
                self.depth -= 1;"""
replace = "                let out = self.call_body(g, frame(g, values));"

[[mutation]]
name = "a-returned-value-is-discarded"
why = """
drops the arm that turns a Flow::Return into the call's value, so every `return` reports
that the function finished without producing anything
Repointed by N39: the call body is a Core IR function's, and its failure is built by `fail`.
"""
file = "crates/nazm-core/src/eval.rs"
find = "            Flow::Return(v) | Flow::Fell(Some(v)) => Ok(v),"
replace = """            Flow::Fell(Some(v)) => Ok(v),
            Flow::Return(_) => Err(fail(
                codes::TYPE_MISMATCH,
                f.body.at,
                format!("`{}` finished without producing a value", f.name),
            )),"""

[[mutation]]
name = "return-does-not-leave-its-block"
why = """
stops only for `break` and `continue`, so a `return` runs the rest of the block and the
statements after it decide the function's value
Repointed by N39: the region walk over Core IR, where a transfer names its loop.
"""
file = "crates/nazm-core/src/eval.rs"
find = """            let flow = self.stmt(f, stmt, env)?;
            if !flow.is_fall_through() {"""
replace = """            let flow = self.stmt(f, stmt, env)?;
            if matches!(flow, Flow::Break(_) | Flow::Continue(_)) {"""

[[mutation]]
name = "a-diverging-branch-forgets-the-other"
why = """
drops the rule that a branch which returns takes the other branch's type, so
`if c { return 0; } else { 1 }` produces nothing instead of an Int
"""
file = "crates/nazm-core/src/check.rs"
find = "                    (Completion::Diverges, other) | (other, Completion::Diverges) => other,"
replace = """                    (Completion::Diverges, _) | (_, Completion::Diverges) => Completion::Unit,"""

[[mutation]]
name = "remainder-inherits-the-hardware-fault"
why = """
makes `smallest % -1` an overflow error, although its result is 0 and 0 is representable —
the exception the spec exists to remove
Repointed by N39: checked arithmetic moved from `binary` to `arith`, over Core IR's `ArithOp`.
"""
file = "crates/nazm-core/src/eval.rs"
find = "        (Rem, Int(a), Int(b)) => Ok(Int(a.wrapping_rem(*b))),"
replace = """        (Rem, Int(a), Int(b)) => a
            .checked_rem(*b)
            .map(Int)
            .ok_or_else(|| overflow("remainder")),"""

[[mutation]]
name = "negative-literals-not-range-checked"
why = """
folds any digit string after `-` into i64::MIN, so `-9223372036854775809` silently becomes
a different number instead of being refused
"""
file = "crates/nazm-syntax/src/parser.rs"
find = "                    Ok(v) if v == 1u64 << 63 => {"
replace = "                    Ok(_) => {"

[[mutation]]
name = "a-failed-body-drops-the-function"
why = """
restores the cascade: one syntax error inside a body deletes the whole declaration, and
every call to it then reports that the function does not exist
"""
file = "crates/nazm-syntax/src/parser.rs"
# Repointed in N15. A body with a syntax error now usually *recovers* rather than fails —
# its statements are kept in the concrete tree and the abstract body is withheld — so the
# line that keeps the declaration for such a body is the recovered arm, not the failed one.
find = """            Some(_) if self.poisoned => None,"""
replace = """            Some(_) if self.poisoned => return None,"""
killers = [{ package = "nazm-syntax", test = "cst", name = "the_abstract_tree_keeps_its_contract_for_a_body_that_recovered" }]

[[mutation]]
name = "nesting-unbounded"
why = """
removes the parser's nesting limit, so a deeply nested tree exhausts the stack in whichever
pass reaches it first — parser, checker, evaluator, or the destructor of the tree — and the
process dies with no diagnostic
"""
file = "crates/nazm-syntax/src/parser.rs"
find = "        if self.depth > MAX_NESTING {"
replace = "        if false {"

[[mutation]]
name = "nesting-counter-never-released"
why = """
counts every construct entered and none left, so nesting becomes a budget for the whole
function and an ordinary flat body of 512 statements is refused as too deep
"""
file = "crates/nazm-syntax/src/parser.rs"
find = """    fn leave(&mut self) {
        self.depth -= 1;
    }"""
replace = """    fn leave(&mut self) {}"""

# Two entries were removed here rather than left failing, because neither described a
# defect the tests could witness:
#
#   nesting-budget-shared-between-functions — dropping the per-item `p.depth = 0` reset
#   survived, and correctly: every successful `enter` is matched by a `leave`, so the
#   counter already returns to zero on its own. The reset is defence against a leak that
#   does not currently exist. `chain-depth-never-unwound` below covers the one path where
#   such a leak is possible, which is the coverage that was actually wanted.
#
#   checking-runs-on-the-callers-stack — parsing on the caller's stack instead of an owned
#   one survived because, with nesting bounded at 512 and the worst shape costing ~14 KB a
#   level, the deepest accepted tree needs about 7 MiB and the CLI's main thread has 8.
#   The weakening is real for a caller with a smaller stack — which is what `parse_source`
#   documents — but stack exhaustion is only observable out of process, and the only
#   out-of-process vehicle here is a binary that happens to have enough. Catalogued as
#   uncovered rather than as caught.
killers = [{ package = "nazm-syntax", lib = true, name = "parser::ast_depth_tests::the_counter_tracks_the_tree_at_the_edge_of_each_shape" }]

[[mutation]]
name = "a-chain-forgets-its-operands-depth"
why = """
measures a binary node as one above its right operand only, so a deep left operand stops
counting — `- - - 1 + 1 + 1` then composes into a tree twice as deep as the limit, which is
the defect the tree bound was added to close
"""
file = "crates/nazm-syntax/src/parser.rs"
find = "            lhs_depth = lhs_depth.max(rhs_depth) + 1;"
replace = "            lhs_depth = rhs_depth + 1;"

[[mutation]]
name = "a-chain-starts-from-nothing"
why = """
starts a chain's depth at zero instead of at the operand already parsed, so everything
below the first operator is uncounted
"""
file = "crates/nazm-syntax/src/parser.rs"
find = "        let mut lhs_depth = self.child();"
replace = "        let mut lhs_depth = 0;"

[[mutation]]
name = "a-block-does-not-count-its-contents"
why = """
measures a block as one level whatever is inside it, so nesting inside a block escapes the
tree bound entirely
"""
file = "crates/nazm-syntax/src/parser.rs"
find = "        self.built(deepest + 1)?;\n        self.wrap(at, SyntaxKind::Block);"
replace = "        self.built(1)?;\n        self.wrap(at, SyntaxKind::Block);"

[[mutation]]
name = "an-if-ignores-its-condition-depth"
why = """
measures an `if` from its branches alone, so a deeply nested condition is not counted
"""
file = "crates/nazm-syntax/src/parser.rs"
find = """                let cond = self.expr()?;
                let mut deepest = self.child();"""
replace = """                let cond = self.expr()?;
                let mut deepest = 0;"""

[[mutation]]
name = "parentheses-count-as-a-node"
why = """
adds a level for punctuation that builds nothing, so `((((x))))` is measured as four levels
deeper than the tree it produces and ordinary parenthesised arithmetic is refused
"""
file = "crates/nazm-syntax/src/parser.rs"
find = """                self.wrap(at, SyntaxKind::ParenExpr);
                Some(inner)"""
replace = """                self.wrap(at, SyntaxKind::ParenExpr);
                self.built(self.child() + 1)?;
                Some(inner)"""

# `chain-depth-never-unwound` and `chain-depth-not-counted` were removed with the code they
# targeted: a per-operator parser-recursion count in the Pratt loop, which was the first and
# wrong attempt at bounding chain depth.
#
# `chain-depth-not-counted` survived a full run, and a survivor is a question, not a
# verdict. What settled it was inspection: `binary` has exactly two recursive paths, and
# only one of them is unbounded. `self.primary()` is counted by `enter`; `self.binary(bp+1)`
# is bounded by the precedence ladder, since `bp` is at most 3 and a call at min_bp 4
# matches no operator and returns at once — three frames, whatever the chain's length. The
# count was therefore measuring loop iterations, not live frames, and the exact tree bound
# covers what it was meant to.
#
# It did not, however, change nothing. Removing it *widens* what is accepted: a chain no
# longer spends parser-recursion budget, so 200 parentheses around a 400-operator chain
# now parses where it was previously refused for a 600 it never needed. That is the
# correction, not a side effect — its tree is 401 deep and it recurses 201 — and
# `a_chain_does_not_spend_the_recursion_budget` pins it so the widening cannot drift back.
#
# `a-chain-forgets-its-operands-depth` and `a-chain-starts-from-nothing` cover what
# replaced it.

[[mutation]]
name = "a-flow-in-value-position-is-an-error"
why = """
treats a `return` raised inside an expression as a failure instead of propagating it, so
`let x = if c { return 1; } else { 2 };` type-checks and then fails at run time
Repointed by N39: `take!` evaluates a Core IR expression, and `no_value` is a free function.
"""
file = "crates/nazm-core/src/eval.rs"
find = "            left => return Ok(left),"
replace = "            left => return Err(no_value($e)),"

[[mutation]]
name = "stack-not-sized-from-the-budget"
why = """
reserves a fixed stack however large the depth budget is, so `--max-depth` above the
default promises a bound the stack cannot back and the program aborts instead of reporting
"""
file = "crates/nazm-core/src/eval.rs"
find = "    STACK_BASE_BYTES.saturating_add(max_depth.saturating_mul(STACK_BYTES_PER_CALL))"
replace = "    STACK_BASE_BYTES"


# --- submission identity -------------------------------------------------------------
#
# A digest that cannot tell two different submissions apart is not an identity, and every
# one of these makes it blind to something a candidate controls.

