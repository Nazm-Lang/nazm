# --- N37: capabilities / authority -----------------------------------------------------------
#
# Each attacks one law of `docs/architecture.md` §7.39 and `docs/spec.md`, *Capabilities*: a
# built-in needs its identity's authority and a `spawn` the authority to start a task; a capability
# kind is not interchangeable with another; nothing constructs one and nothing else is handed to
# `main`; authority is the bindings a name reaches, never a spelling, a shadowed binding or a
# declared effect; a function with no declared set exercises its caller's authority, across a
# module too, and a task's function its spawner's; holding a capability adds no effect; the
# witness follows the chain; a capability has no equality; the interface carries the kind; the
# entry hands `main` its roots; and the epoch moved.

