# --- N13: derived structural equality ------------------------------------------------------
#
# Each entry was written with the semantic test that observes it and carries the killer
# `cargo xtask contained mutate --verify-killer` confirmed. The capability is derived in one
# place per checker, run in one place per implementation, and these break each of them.

