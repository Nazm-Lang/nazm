file = "compiler/emit.nz"
find = """                                                        join_from(out, next, current, live,
                                                                ints_get(loop_scope, ints_len(loop_scope) - 1));
                                                        branch(out, live, blk("x", w));"""
replace = """                                                        branch(out, live, blk("x", w));"""

[[mutation]]
name = "a-return-out-of-a-scope-does-not-join-it"
why = """
the same for `return`: the frame is left with the scope's tasks still running and their
failure unseen
"""
file = "compiler/emit.nz"
find = """                                                                join_from(out, next, current, live, 2);
                                                                // Rule 3."""
replace = """                                                                // Rule 3."""

