        return Ok(());
    }"""

[[mutation]]
name = "freeze-accepts-evidence-about-another-attempt"
why = """
drops the attempt check on the quiescence token, so evidence that attempt A's candidate
stopped authorises freezing attempt B's workspace — whose candidate may still be writing
"""
file = "crates/nazm-bench/src/workspace.rs"
