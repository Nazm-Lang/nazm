# --- N15: the lossless concrete syntax tree and local recovery ---------------------------
#
# Each observes one promise the tree makes — every byte kept, every leaf its own bytes, the
# two trees agreeing, recovery local and bounded — and names the regression test that
# states it. `crates/nazm-syntax/tests/cst.rs` holds the tests; `docs/capability-matrix.md`
# area 1 records what the campaign found.

