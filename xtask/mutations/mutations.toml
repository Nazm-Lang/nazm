                    .res
                    .function(callee)
                    .and_then(|d| self.res.definition(nazm_sema::ModuleId::ROOT, &d.name))
                    .unwrap_or(callee);
                // A foreign call's crossing, written as ordinary Core IR (N85, §7.86)."""
