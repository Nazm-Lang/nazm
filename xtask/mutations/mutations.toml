# The document that was edited cannot keep an old analysis: `change` replaces it with none
# before anything is analysed, so this defect reaches the *other* open documents — an
# importer whose dependency just broke. Its killer is the test that asks the importer a
# question after that happens; the first killer named here was the edited-document test,
# which `--verify-killer` reported is not one.
