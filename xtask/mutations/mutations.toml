# --- N33: the repository context map and the minimum task context -----------------------
#
# Each attacks one law of `docs/architecture.md` §7.35: the seed is always there, a
# direct dependency is selected, a goal never outranks the specification, a budget's cut is
# never a complete answer, a stale state is refused, a path is never an id, the map is in
# canonical order and validated, a test is related only where a mutation lands, a fan-out
# cut is counted, a section that only links is pointed at and not sent, and a definition is
# asked for at its name.

[[profile]]
name = "repo"
why = "the repository map and the task planner are observed by nazm-repo's own suites, the CLI's repository and schema tests, and the MCP protocol tests of the two repository tools"
owns = ["crates/nazm-repo/"]
targets = [
    { package = "nazm-repo", lib = true },
    { package = "nazm-repo", test = "repository" },
    { package = "nazm-repo", test = "benchmark" },
    { package = "nazm-cli", test = "repository" },
    { package = "nazm-cli", test = "schemas" },
    { package = "nazm-mcp", test = "protocol" },
]

[[mutation]]
name = "n33-the-seed-is-left-out"
