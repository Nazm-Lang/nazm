# --- N35: the agent task benchmark ------------------------------------------------------------
#
# Each attacks one law of `docs/architecture.md` §7.37: two arms carry two contexts and one
# prompt, each answer is scored by its own task's oracle, a claim the truths lack is never
# credit and a hallucination is not a misreading, input is not output, each usage category has
# its own price and output is billed, a zero denominator is absent, an identity has the prompt
# in it, a runner error is not an answer, the stress case stays, a transport failure is retried
# twice and no more, the cap covers the attempt about to be made, and a credential never
# survives into kept text.

[[profile]]
name = "agent"
why = "the agent benchmark is observed by its own suite: the fake provider, recorded responses, the oracle's exactness and the report's determinism"
owns = ["crates/nazm-agent-bench/"]
targets = [
    { package = "nazm-agent-bench", lib = true },
    { package = "nazm-agent-bench", test = "agent" },
]

[[mutation]]
name = "n35-both-arms-carry-one-context"
why = "the N33 arm is given the baseline's bytes, so the comparison compares a context with itself"
file = "crates/nazm-agent-bench/src/suite.rs"
find = "        Context::new(Arm::N33, s.json.clone())?,"
replace = "        Context::new(Arm::Baseline, baseline(s))?,"
killers = [{ package = "nazm-agent-bench", test = "agent", name = "the_suite_has_every_category_keeps_scenario_c_and_gives_each_arm_its_own_context" }]

[[mutation]]
name = "n35-another-tasks-oracle"
why = "every answer is scored against the first task's truths, so a correct answer to any other task fails"
file = "crates/nazm-agent-bench/src/run.rs"
find = "                let score = oracle::score(p.task, p.arm, &reply.text);"
replace = "                let score = oracle::score(suite.tasks.first().unwrap_or(p.task), p.arm, &reply.text);"
killers = [{ package = "nazm-agent-bench", test = "agent", name = "a_transport_failure_is_retried_twice_and_is_never_an_incorrect_answer" }]

[[mutation]]
name = "n35-an-unmatched-name-is-a-truth"
