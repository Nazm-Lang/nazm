[[mutation]]
name = "string-storage-goes-while-another-view-remains"
why = """
frees a backing on every release rather than on the last one, which is reference counting
with the counting removed. A slice of a slice, or a string bound twice, then frees storage
its siblings still point into — and a program with no sharing behaves identically, which is
what makes this the shape worth catching
