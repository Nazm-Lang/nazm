[[mutation]]
name = "ledger-keys-claims-by-engine-id"
why = """
keys outstanding claims by the whole ResourceId, so an Intended entry and its own Created
entry become different rows and every completed attempt looks like it leaked everything
"""
file = "crates/nazm-bench/src/sandbox/ledger.rs"
