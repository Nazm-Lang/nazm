# --- Gate 2: bytes and text -------------------------------------------------------------------
#
# Each attacks one law of `docs/spec.md`, *Bytes* and *Text*: every range is checked in every
# implementation; the runtime's UTF-8 validator refuses surrogates and overlong forms; a boundary
# is never a continuation byte; byte order is the one asked for; a view keeps its buffer; `Text(s)`
# validates; a surrogate is not a scalar value; a `Bytes` does not cross into a task; `Text` is
# equal by its bytes; and a literal is a `Text` where one is expected.

