# The eight defects the N8 architecture makes possible. Each one is a rule from the memory
# constitution removed, and each is the *cheapest* way to remove it — a line deleted, a
# comparison widened — because a mutation that also breaks compilation proves nothing.

[[mutation]]
name = "a-slice-does-not-retain-its-backing"
why = """
makes `str_slice` a pointer and a length again, keeping the owner field but adding no
reference to it. The slice then dies with whatever it was cut from, which for
`str_slice(str_concat(a, b), 1, 2)` is the same statement: the argument is released as a
temporary the moment the built-in returns, and the result points into the freed buffer.
This is the exact failure the third field exists to make impossible
"""
file = "crates/nazm-lir/src/emit.rs"
find = """                let _ = writeln!(self.out, "  call void @nz.str_retain(ptr %{owner})");
                self.needs_strings = true;
                let out = self.make_str(start, n, &format!("%{owner}"));"""
replace = """                self.needs_strings = true;
                let out = self.make_str(start, n, &format!("%{owner}"));"""

[[mutation]]
name = "a-sequence-does-not-retain-the-string-it-stores"
why = """
lets `strs_push` keep a string without taking a reference to it. The caller's binding is
then the only one counted, and the element becomes a dangling view the moment that binding
dies — while the sequence goes on reporting a length that includes it
"""
file = "crates/nazm-lir/src/emit.rs"
find = """                self.retain(arg(1), elem);
                let _ = writeln!(
                    self.out,
                    "  store {} %{}, ptr %{slot}",
                    llvm_type(self.types, elem),
                    arg(1)
                );"""
replace = """                let _ = writeln!(
                    self.out,
                    "  store {} %{}, ptr %{slot}",
                    llvm_type(self.records, elem),
                    arg(1)
                );"""

[[mutation]]
name = "a-string-read-out-of-a-sequence-is-only-borrowed"
why = """
hands back the stored descriptor without a reference of its own, so overwriting the
element — or releasing the sequence — invalidates a value the program is still holding.
`docs/spec.md` has promised since sequences existed that a `Str` already read out is
unaffected by changing the sequence; until N8 that was true because nothing was freed
"""
file = "crates/nazm-lir/src/emit.rs"
find = """                if elem.owns().is_some() {
                    self.take(v, elem);
                    self.own(v, elem);
                }
                return Val::Of { value: v, ty: elem };"""
replace = """                return Val::Of { value: v, ty: elem };"""

[[mutation]]
name = "an-overwritten-element-is-never-released"
why = """
replaces an element and abandons the one it replaced, which is the leak N8 exists to close
wearing a container as a disguise: a loop that writes the same slot a million times holds a
million backings and reports a sequence of length one
"""
file = "crates/nazm-lir/src/emit.rs"
find = """                    arg(2)
                );
                self.release(old, elem);"""
replace = """                    arg(2)
                );"""

[[mutation]]
name = "a-sequence-of-strings-does-not-release-its-contents"
why = """
frees the array of descriptors and leaves every string it named behind. The count of
sequences then looks perfect — the header really was reclaimed — while the bytes are gone
for good. Converting a leak into a leak inside a container is the failure §17 of the N8
directive names by that description
"""
file = "crates/nazm-lir/src/emit.rs"
find = """  %last = icmp sle i64 %rc2, 0
  br i1 %last, label %contents, label %done
contents:
  %n = load i64, ptr %h
  %dp = getelementptr i8, ptr %h, i64 16
  %data = load ptr, ptr %dp
  br label %test
test:
  %i = phi i64 [ 0, %contents ], [ %next, %body ]
  %more = icmp slt i64 %i, %n
  br i1 %more, label %body, label %storage
body:
  %e = getelementptr { ptr, i64, ptr }, ptr %data, i64 %i"""
replace = """  %last = icmp sle i64 %rc2, 0
  br i1 %last, label %storage, label %done
contents:
  %n = load i64, ptr %h
  %dp = getelementptr i8, ptr %h, i64 16
  %data = load ptr, ptr %dp
  br label %test
test:
  %i = phi i64 [ 0, %contents ], [ %next, %body ]
  %more = icmp slt i64 %i, %n
  br i1 %more, label %body, label %storage
body:
  %e = getelementptr { ptr, i64, ptr }, ptr %data, i64 %i"""

[[mutation]]
name = "string-storage-goes-while-another-view-remains"
why = """
frees a backing on every release rather than on the last one, which is reference counting
with the counting removed. A slice of a slice, or a string bound twice, then frees storage
its siblings still point into — and a program with no sharing behaves identically, which is
what makes this the shape worth catching
"""
file = "crates/nazm-lir/src/emit.rs"
find = """  %old = atomicrmw sub ptr %b, i64 1 release
  %last = icmp eq i64 %old, 1"""
replace = """  %old = atomicrmw sub ptr %b, i64 1 release
  %last = icmp sge i64 %old, 1"""

[[mutation]]
name = "a-channel-goes-while-another-reference-remains"
why = """
destroys a channel's mutex, condition variable, ring and header on the first release. The
argument that makes `rc == 0` a safe moment to do this is that a waiter implies a live
reference; removing the count removes the argument, and a channel a task still holds is
torn down under it
"""
file = "crates/nazm-lir/src/emit.rs"
find = """  %old = atomicrmw sub ptr %rcp, i64 1 release
  %last = icmp eq i64 %old, 1"""
replace = """  %old = atomicrmw sub ptr %rcp, i64 1 release
  %last = icmp sge i64 %old, 1"""

[[mutation]]
name = "a-spawn-argument-is-not-held-for-its-task"
why = """
packs a string or a channel into a task's argument block without taking a reference to it,
so a binding reassigned inside the scope releases storage the task is still reading — and
the trampoline then releases it a second time. The window is real rather than theoretical:
the scope's body runs concurrently with the task by construction
"""
file = "crates/nazm-lir/src/emit.rs"
find = """            self.take(*value, *ty);
            let _ = writeln!(
                self.out,
                "  store {} %{value}, ptr %{slot}",
                llvm_type(self.types, *ty)
            );"""
replace = """            let _ = writeln!(
                self.out,
                "  store {} %{value}, ptr %{slot}",
                llvm_type(self.types, *ty)
            );"""

[[mutation]]
name = "the-self-hosted-emitter-skips-one-release-path"
why = """
takes the frame release off the tail of every function the **Nazm-written** compiler emits,
which is the shape N7 shipped for a whole milestone without noticing: every behavioural test
still passes, because a program that never frees computes the same answers as one that does.
Only a differential test that compares what the two compilers' programs *reclaimed* can see
it, which is what `the_nazm_written_compiler_emits_the_same_memory_semantics` is for
"""
file = "compiler/emit.nz"
find = """                                                                                                        own_keep(out, next, owned, tv, ints_get(nrec, k), rowns, otype);
                                                                                                        release_frame(out, next, frame, rowns);"""
replace = """                                                                                                        own_keep(out, next, owned, tv, ints_get(nrec, k), rowns, otype);"""


# --- N9: records -----------------------------------------------------------------------
#
# A record owns nothing of its own, so every one of these is about *composition*: a copy
# that forgets a field, a drop that does not recurse, a rule derived from the fields that
# stops looking at all of them. That is the property the milestone claims, so it is the
# property these try to break.

[[mutation]]
name = "a-record-copy-forgets-a-field"
why = """
generates a retain helper that takes a reference to nothing, so copying a record leaves
every owning field counted once while two values name it. The first of the two to die
frees storage the other is still reading
"""
file = "crates/nazm-lir/src/emit.rs"
find = """            if retain {
                self.retain(v, ty);
            } else {
                self.release(v, ty);
            }"""
replace = """            if retain {
            } else {
                self.release(v, ty);
            }"""

[[mutation]]
name = "a-record-drop-omits-its-fields"
why = """
generates a release helper that releases nothing, so a record that goes out of scope keeps
every backing, sequence and channel it held. The counts say so; nothing else does
"""
file = "crates/nazm-lir/src/emit.rs"
find = """            if retain {
                self.retain(v, ty);
            } else {
                self.release(v, ty);
            }"""
replace = """            if retain {
                self.retain(v, ty);
            } else {
            }"""

[[mutation]]
name = "a-record-drop-does-not-recurse"
why = """
answers `does this record own anything` by looking at its immediate fields only, so a
record whose only owning thing is two levels down is treated as owning nothing: no helper,
no frame slot, and every string inside it leaked
"""
file = "crates/nazm-lir/src/emit.rs"
find = """            Some(Owns::Record(id)) => record_layout(types.records, id)
                .map(|l| l.fields.clone())
                .unwrap_or_default(),"""
replace = "            Some(Owns::Record(_)) => continue,"

[[mutation]]
name = "a-field-replacement-releases-before-it-takes"
why = """
releases the old field before the new value is taken, so `p.name = p.name` and any
replacement whose new value shares the old one's backing free storage they are about to
store. A use-after-free rather than a leak, and the order of two lines is all of it
"""
file = "crates/nazm-lir/src/emit.rs"
find = """                    Val::Of { value: v, ty } => {
                        self.take(v, ty);
                        self.set_field(*slot, path, v, ty);"""
replace = """                    Val::Of { value: v, ty } => {
                        self.set_field(*slot, path, v, ty);
                        self.take(v, ty);"""

[[mutation]]
name = "a-projection-out-of-a-temporary-is-only-borrowed"
why = """
reads a field out of a record without taking a reference to what backs it, so
`let s = make().name;` holds a view of storage the temporary released on the same line.
Invisible in every shape where something else keeps the record alive, which is why the
test that finds it uses a temporary that dies immediately
"""
file = "crates/nazm-lir/src/emit.rs"
find = """                if !borrowed && owns_anything(self.types, *ty) {
                    self.retain(out, *ty);
                    self.own(out, *ty);
                }"""
replace = """                if false && owns_anything(self.types, *ty) {
                    self.retain(out, *ty);
                    self.own(out, *ty);
                }"""

[[mutation]]
name = "a-partly-built-record-is-not-cleaned"
why = """
assembles a construction in registers rather than in a frame slot, so an initialiser that
fails after an earlier one produced a heap string leaves it unreachable from the frame's
cleanup. The one path where the program was already failing becomes the one that leaks
"""
file = "crates/nazm-lir/src/lower.rs"
find = """    let slot = ctx
        .res
        .types()
        .needs_cleanup(nazm_sema::Type::Record(id))
        .then(|| ctx.hidden(ty, "record"));"""
replace = "    let slot = None;"

[[mutation]]
name = "task-safety-stops-at-the-first-level"
why = """
derives a record's task safety from its immediate fields only, so `Outer { inner: Inner {
values: Ints } }` crosses into a task. `N0321` exists because a sequence is unsynchronised
shared mutable storage; wrapping one twice does not make it safe, and this says it does
"""
file = "crates/nazm-sema/src/udt.rs"
find = """                Type::Record(_) | Type::Enum(_) => {
                    let n = names.len();
                    path.extend(names);
                    if let Some(inner) = TypeNode::of(ty) {
                        stack.push((inner, 0, n));
                    }
                }"""
replace = """                Type::Record(_) | Type::Enum(_) => {}"""

[[mutation]]
name = "an-exported-record-is-left-out-of-the-interface"
why = """
publishes a module's functions and not its records, so an importer checking against the
persisted interface alone cannot resolve a type its signatures name. N3's boundary held
because an interface was sufficient; this makes it insufficient and silent
"""
file = "crates/nazm-sema/src/interface.rs"
find = """    pub fn records(&self) -> &[RecordExport] {
        &self.records
    }"""
replace = """    pub fn records(&self) -> &[RecordExport] {
        &self.records[..0]
    }"""

[[mutation]]
name = "a-published-field-loses-its-type"
why = """
writes every field's type as `Int` in the persisted interface, so an exported record's
shape no longer moves the fingerprint when a field's type changes. A dependent keeps an
answer the new shape contradicts, which is the stale accept a fingerprint exists to stop
"""
file = "crates/nazm-iface/src/wire.rs"
find = """            out.push(PersistentField {
                name: f.name.clone(),
                ty,
            });"""
replace = """            let _ = ty;
            out.push(PersistentField {
                name: f.name.clone(),
                ty: "Int".to_owned(),
            });"""

[[mutation]]
name = "a-published-record-is-named-by-its-spelling"
why = """
names a record in the persisted interface by its source name rather than by its durable
identity, so two modules' `Point` become one type across a build. The same collision N5
removed for function symbols, in the layer above it
"""
file = "crates/nazm-iface/src/wire.rs"
find = """            let key = graph.key(def.module)?;
            Some(DefKey::new(key.clone(), DefKind::Record, def.name.clone()).to_string())"""
replace = "            Some(def.name.clone())"

[[mutation]]
name = "the-native-layout-follows-the-declaration"
why = """
lays a record's fields out in declaration order rather than canonically by name, so moving
two field declarations changes the object file. `docs/spec.md` says that edit means
nothing; this makes the compiler and the linker disagree about whether anything happened
"""
file = "crates/nazm-lir/src/lower.rs"
