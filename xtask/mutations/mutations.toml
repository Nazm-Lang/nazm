# --- N13: derived structural equality ------------------------------------------------------
#
# Each entry was written with the semantic test that observes it and carries the killer
# `cargo xtask contained mutate --verify-killer` confirmed. The capability is derived in one
# place per checker, run in one place per implementation, and these break each of them.

[[mutation]]
name = "n13-a-vec-has-equality"
why = """`Vec[T]` is given `==`, which would have to mean the same storage or the same contents — the choice the language has not made
Repointed by Gate 2, whose `Text` joined the types with equality on that line."""
file = "crates/nazm-sema/src/udt.rs"
find = "            Type::Int | Type::Bool | Type::Str | Type::Text | Type::Num(_) => true,"
replace = "            Type::Int | Type::Bool | Type::Str | Type::Text | Type::Num(_) | Type::Vec(_) => true,"
killers = [{ package = "nazm-core", test = "equality", name = "handles_still_have_no_equality" }]

[[mutation]]
name = "n13-a-sequence-has-equality"
why = """`Ints` and `Strs` are given `==`, for the same unmade choice
Repointed by Gate 2, whose `Text` joined the types with equality on that line."""
file = "crates/nazm-sema/src/udt.rs"
find = "            Type::Int | Type::Bool | Type::Str | Type::Text | Type::Num(_) => true,"
replace = "            Type::Int | Type::Bool | Type::Str | Type::Text | Type::Num(_) | Type::Ints | Type::Strs => true,"
killers = [{ package = "nazm-core", test = "equality", name = "handles_still_have_no_equality" }]

[[mutation]]
name = "n13-a-chan-has-equality"
why = """`Chan` is given `==`, exposing a channel's identity as a value
Repointed by Gate 2, whose `Text` joined the types with equality on that line."""
file = "crates/nazm-sema/src/udt.rs"
find = "            Type::Int | Type::Bool | Type::Str | Type::Text | Type::Num(_) => true,"
replace = "            Type::Int | Type::Bool | Type::Str | Type::Text | Type::Num(_) | Type::Chan => true,"
killers = [{ package = "nazm-core", test = "equality", name = "handles_still_have_no_equality" }]

[[mutation]]
name = "n13-a-type-answers-for-its-first-component-only"
why = "the capability walk looks at each definition's first field or payload field and no further, so `struct B { ok: Int, values: Vec[Int] }` compares"
file = "crates/nazm-sema/src/udt.rs"
find = """            stack.push((node, at + 1, pushed));
            match TypeNode::of(ty) {"""
replace = """            match TypeNode::of(ty) {"""
killers = [{ package = "nazm-core", test = "equality", name = "a_record_has_equality_exactly_when_every_field_does" }]

[[mutation]]
name = "n13-an-enum-answers-for-its-first-variant-only"
why = "the capability walk skips every variant after the first, so `enum Work { Empty, Values(value: Vec[Int]) }` compares — the flow-insensitive rule broken the way a value-based reading would break it"
file = "crates/nazm-sema/src/udt.rs"
find = """            stack.push((node, at + 1, pushed));
            match TypeNode::of(ty) {"""
replace = """            stack.push((node, at + 1, pushed));
            if variant.is_some_and(|v| v > 0) {
                continue;
            }
            match TypeNode::of(ty) {"""
killers = [{ package = "nazm-core", test = "equality", name = "an_enum_has_equality_only_when_every_variant_does" }]

[[mutation]]
name = "n13-a-nested-type-is-not-walked"
why = "a record or enum inside another is taken to compare without looking inside it, so `struct D { inner: B }` compares when `B` does not"
file = "crates/nazm-sema/src/udt.rs"
find = """                    path.extend(names);
                    stack.push((inner, 0, n));
                }
                None if leaf(ty) => {}"""
replace = """                    let _ = (names, n);
                }
                None if leaf(ty) => {}"""
killers = [{ package = "nazm-core", test = "equality", name = "a_type_without_equality_anywhere_inside_blocks_the_whole" }]

[[mutation]]
name = "n13-two-types-of-one-shape-compare"
why = "the same-type requirement is dropped: `A(x: 1) == B(x: 1)` is accepted for two records of one shape — structural cross-nominal equality"
file = "crates/nazm-core/src/check/operators.rs"
find = "            BinOp::Eq | BinOp::NotEq => lt == rt && self.res.types().equality(lt).is_ok(),"
replace = "            BinOp::Eq | BinOp::NotEq => self.res.types().equality(lt).is_ok(),"
killers = [{ package = "nazm-core", test = "equality", name = "two_types_of_one_shape_are_never_compared" }]

[[mutation]]
name = "n13-a-refusal-names-no-component"
why = "the refusal stops naming the field path that blocks equality, so `Outer` is refused without saying `inner.values` is why"
file = "crates/nazm-core/src/check/operators.rs"
find = "            let detail = if let Some(why) = blocked.filter(|w| !w.path.is_empty()) {"
replace = "            let detail = if let Some(why) = blocked.filter(|w| w.path.is_empty()) {"
killers = [{ package = "nazm-core", test = "equality", name = "a_refusal_names_the_component_that_has_no_equality" }]

[[mutation]]
name = "n13-interpreted-records-compare-their-first-field-only"
why = "the interpreter compares a record's first field and stops, so `Point(x: 1, y: 2) == Point(x: 1, y: 9)`"
file = "crates/nazm-core/src/eval/arith.rs"
find = """        for (x, y) in xs.iter().zip(ys) {
            if !equal(x, y)? {
                return Some(false);
            }
        }
        Some(true)"""
replace = """        match (xs.first(), ys.first()) {
            (Some(x), Some(y)) => equal(x, y),
            _ => Some(true),
        }"""
