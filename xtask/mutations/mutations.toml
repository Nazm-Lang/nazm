    if own >= 0 { return own; }
    visible_import(vmod, vname, vfn, here, name)"""
replace = """    let own = owned_index(fnames, fowner, here, name);
    if own >= 0 { return own; }
    let seen = visible_import(vmod, vname, vfn, here, name);
    if seen >= 0 { return seen; }
    builtin_index(fnames, name)"""
killers = [{ package = "nazm-cli", test = "selfhost", name = "the_two_compilers_agree_on_every_module_and_visibility_rule" }]

