# --- N39: Core IR, the one lowering ------------------------------------------------------------
#
# Each attacks one law of `docs/architecture.md` §7.41: a call names its callee by identity, every
# value is typed, an `if`'s branches, a `return` and a loop's back edge mean what they say, every
# `break` and `continue` names its loop, an initialiser fills its field and a construction its
# variant, a function's effect contract and authority survive, a digest names callees durably,
# covers the body, keeps effects out of the body digest and ignores arm order, the verifier refuses
# a stray transfer, a generic call has its instantiated result, the interpreter picks the arm the
# value is, and nothing below Core IR asks the resolution what a position meant.

