[[mutation]]
name = "the-statement-conditional-selects-the-wrong-branch"
why = """
Swaps the arms of a statement-position `if`, so `if c { a } else { b }` runs `b` when `c`
holds. Nothing structural notices: both labels exist, both blocks have terminators, and
clang accepts the module — the program simply does the other thing.

Split from a single `the-conditional-selects-the-wrong-branch` entry at final
integration. That entry's pattern was the `br i1` line alone, which occurs in **two**
functions — `statement_if` and `conditional` — so the runner refused it as not unique
and the mutation had stopped applying at all. A pattern that matches twice proves
nothing, and the repair is two precise entries rather than one ambiguous one: the
statement form and the value form are separate code paths and each deserves its own
fact.
Repointed by N40: the branch terminator MIR gives a statement `if`, which the backend emits as it is.
"""
file = "crates/nazm-mir/src/lower.rs"
find = """                cond: c,
                then: then_b,
                otherwise: else_b,
            },
            at,
        );
        let mut arrives = otherwise.is_none();"""
replace = """                cond: c,
                then: else_b,
                otherwise: then_b,
            },
            at,
        );
        let mut arrives = otherwise.is_none();"""

[[mutation]]
name = "the-value-conditional-selects-the-wrong-branch"
why = """
The same swap in a value-position `if`, which is a different function and a different
shape: it has a join block and a `phi`, so the wrong arm's value is what the expression
produces. Caught by outcome rather than by anything about the IR being malformed — the
`phi` is well-formed either way.
Repointed by N40: the branch terminator MIR gives a value `if`.
"""
file = "crates/nazm-mir/src/lower.rs"
find = """                cond: c,
                then: then_b,
                otherwise: else_b,
            },
            at,
        );
        let mut arrives = false;"""
replace = """                cond: c,
                then: else_b,
                otherwise: then_b,
            },
            at,
        );
        let mut arrives = false;"""

[[mutation]]
name = "two-same-typed-arguments-are-transposed"
why = """
The calling defect that survives everything structural. Swapping two arguments of the
*same* type produces LLVM that is completely well-formed — right arity, right types, right
symbol — so clang accepts it and no assertion about the emitted IR notices. Only running a
program whose result depends on argument order does.

Guarded on the two types being equal on purpose: a mutation that transposed differently
typed arguments would emit `call i64 @nz.f1(i1 %a, i64 %b)`, clang would reject it, and
the verdict would be UNUSABLE. A build failure is not evidence that an argument-order test
discriminates — it is evidence that the IR was malformed, which is a different defect and
one the tests below never had to catch.

Caught by `arguments_are_not_swapped`, which uses noncommutative operations: `sub(10, 3)`
is 7 and the transposition makes it -7. `mix(1, 2, 3)` catches a rotation as well.
Repointed by N40: a call's operands are MIR's, loaded in order by the backend.

Repointed by N42: the call site now also decides whether the callee is foreign; a C call's arguments are the same operands in the same order."""
file = "crates/nazm-lir/src/emit.rs"
find = """                let vals: Vec<(u32, Ty)> = args.iter().map(|a| self.operand(a)).collect();
                let foreign = self.sigs.get(callee.index()).is_some_and(|s| s.foreign);"""
replace = """                let mut vals: Vec<(u32, Ty)> = args.iter().map(|a| self.operand(a)).collect();
                if vals.len() >= 2 && vals[0].1 == vals[1].1 {
                    vals.swap(0, 1);
                }
                let foreign = self.sigs.get(callee.index()).is_some_and(|s| s.foreign);"""

[[mutation]]
name = "the-loop-reuses-its-first-condition"
why = """
The defect a loop exists to not have. The back edge is redirected from the condition block
to the body block, so the condition is evaluated once, found true, and never looked at
again — every loop that would have terminated runs away.

Nothing structural catches it. The IR is well-formed, every block has a terminator, clang
accepts the module, and `br label %b2` still appears in the emitted text because the block
*before* the loop branches into the condition exactly as it did.

Caught behaviourally by 13 tests, and the distinction between how they catch it is the
point. Nine report a **deadline**, including
`the_condition_is_reevaluated_on_every_iteration`, which runs the compiled program under an
explicit 10-second limit at `-O0` and `-O2` and fails if it has not finished — that test
exists because `nazm build` emits no iteration budget (`docs/spec.md`, *The native
execution contract for loops*), so a suite without deadlines would hang rather than report.
The other four terminate and fail on the **outcome**: their runaway bodies overflow `Int`
within seconds, so the program exits 2 with `N0400` where 0 and a value were expected.
Neither group alone would have been the whole story, and a timeout is recorded as a
failure rather than as a result.
Repointed by N40: the back edge MIR lowering gives a loop body, to its condition block.
"""
file = "crates/nazm-mir/src/lower.rs"
find = """        self.stack.pop();
        if self.cur.is_some() {
            self.goto(head, at);
        }
        self.cur = Some(exit);"""
replace = """        self.stack.pop();
        if self.cur.is_some() {
            self.goto(body_b, at);
        }
        self.cur = Some(exit);"""
killers = [{ package = "nazm-cli", test = "build", name = "the_condition_is_reevaluated_on_every_iteration" }]

[[mutation]]
name = "continue-jumps-to-the-body-not-the-condition"
why = """
The target-selection defect that `continue` exists to not have. The loop's recorded
`head` target is replaced by its body label, so `continue` re-enters the body **without
re-evaluating the condition** — skipping any call or checked arithmetic in it, and turning
every loop a `continue` can reach into one that never re-tests its exit.

Nothing structural catches it. Every block still has exactly one terminator, every branch
still names a real block, every `phi` still names a real predecessor, and clang accepts
the module — the emitted IR is well-formed, it just means something else. The back edge
from the *bottom* of the body is untouched, so tests asserting that a back edge to the
condition block exists still pass.

Chosen over the mirror defect (`break` targeting the head) because this one is silent in
the common case: a loop whose body ends in `continue` simply never terminates, while a
misdirected `break` usually still exits.

Caught by `continue_skips_the_rest_of_the_iteration_and_rechecks_the_condition`,
`an_inner_continue_reevaluates_the_inner_condition` and others, behaviourally — by the
subprocess deadline where the mutant no longer terminates, and by a wrong value where it
does.
Repointed by N40: a `continue` is a MIR `goto` to its loop's condition block; the body block is created right after it.
"""
file = "crates/nazm-mir/src/lower.rs"
find = "        let (depth, to) = (frame.depth, if leave { frame.exit } else { frame.head });"
replace = "        let (depth, to) = (frame.depth, if leave { frame.exit } else { BlockId(frame.head.0 + 1) });"

[[mutation]]
name = "return-does-not-end-the-block-it-is-in"
why = """
`return` diverges, and lowering records that by ending the statement sequence with
`Ends::Transfers`. Dropping it to `Ends::FallsThrough` makes lowering believe a body
whose every path returns still falls off the end, so it then demands a tail expression
and **refuses a valid program** with "a block with no final result expression".

A behavioural catch rather than a structural one: the mutant compiles, emits nothing
malformed, and simply rejects source the language accepts. `nazm run` executes the same
program, which is what makes the refusal wrong rather than a matter of taste.

Caught by `a_body_where_every_path_returns_needs_no_tail` and the `classify` program in
`the_emitted_ir_for_a_return_heavy_function_is_well_formed`, both of which fail at the
build step with a diagnostic instead of producing a value.
Repointed by N39: LIR lowering reads Core IR statements; the refusal is the same.
Repointed by N40: a `return` seals its MIR block; lowering then treats control as gone.
"""
file = "crates/nazm-mir/src/lower.rs"
find = """                if self.cur.is_some() {
                    self.cleanup_to(0, *at);
                    self.seal(Terminator::Return(tmp), *at);
                }"""
replace = """                if self.cur.is_some() {
                    self.cleanup_to(0, *at);
                    let open = self.cur;
                    self.seal(Terminator::Return(tmp), *at);
                    self.cur = open;
                }"""

