# Mutation catalogue.
#
# Each entry names a defect the test suite claims to catch. `cargo xtask mutate` applies
# one, rebuilds, runs the suite, and requires it to FAIL — then restores and requires it to
# pass again.
#
# The verification that matters most is that the injection actually landed. Twice during
# development a replacement silently matched nothing (cargo fmt had rewrapped the target),
# the suite passed, and the result was indistinguishable from a surviving mutation. So a
# no-op replacement is now a hard error, not a pass.
#
# Since N12.2 an entry may also say where its defect is seen, so a campaign can stop as
# soon as a member of the suite has seen it:
#
#   killers = [{ package = "nazm-cli", test = "value_blocks", name = "a_str_tail_survives_its_local" }]
#
# names tests, exactly (package, one of `lib = true` / `test = "…"` / `bin = "…"`, and the
# full libtest path), that were *verified* to pass without the mutant and fail with it:
# `cargo xtask contained mutate --verify-killer NAME --killer PKG:test=T:PATH`. Never
# written from intuition, and never an arbitrary command: the harness builds the
# invocation. `profile = "…"` overrides the profile chosen from the `[[profile]]` whose
# `owns` is the longest prefix of `file`; naming one without a killer requires a
# `no_killer = "…"` reason.
#
# A killer or a profile can make a campaign faster. Neither can make it report SURVIVED:
# only the workspace suite does that. See `docs/runbook.md`, "Mutation campaigns".

[[mutation]]
name = "acceptance-rate-denominator"
why = "divides acceptances by acceptances, pinning every arm's rate at 1.0"
file = "crates/nazm-bench/src/report.rs"
find = "accepted as f64 / counted.len() as f64"
replace = "accepted as f64 / counted.iter().filter(|a| a.is_accepted()).count() as f64"

[[mutation]]
name = "cost-numerator-drops-failures"
why = "sums only successful attempts, so an arm that fails cheaply looks cheap"
file = "crates/nazm-bench/src/report.rs"
find = "let costs: Vec<&crate::cost::Cost> = counted.iter().map(|a| &a.cost).collect();"
replace = "let costs: Vec<&crate::cost::Cost> = counted.iter().filter(|a| a.is_accepted()).map(|a| &a.cost).collect();"

[[mutation]]
name = "missing-cost-becomes-zero"
why = "a dropped usage record silently reads as free"
file = "crates/nazm-bench/src/cost.rs"
find = """                CostComponent::Missing { reason } => {
                    gaps.push((line.to_owned(), reason.clone()));
                }"""
replace = "                CostComponent::Missing { reason: _ } => {}"

[[mutation]]
