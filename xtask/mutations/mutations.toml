# ---------------------------------------------------------------------------------------
# Focused profiles: tier 2.
#
# Whole test targets that observe the subsystem a mutated file belongs to, run when an
# entry has no killer or its killers passed. A profile is an optimisation and nothing
# more: a profile that passes escalates to the workspace suite, so a profile that is too
# narrow costs time and cannot produce a false survivor. Ownership is by path prefix, the
# longest wins, and no two profiles own the same prefix.
#
# Measured cost, one CPU, one test thread (2026-09-24): selfhost 118 s, build 55 s,
# concurrent 47 s, xtask 12 s, memory 10 s, native_cache 7 s, everything else under 5 s.
# The workspace suite is about 228 s. `build` and `concurrent` are left out of every
# profile on purpose: together they are 100 s and a quarter of all tests, and a defect
# only they see still reaches them at tier 3.
# ---------------------------------------------------------------------------------------

[[profile]]
name = "selfhost"
why = "the Nazm-written compiler is observed by the differential and conformance tests in selfhost.rs, which build it from compiler/*.nz and compare it with the reference"
owns = ["compiler/", "library/"]
targets = [{ package = "nazm-cli", test = "selfhost" }]

[[profile]]
name = "native"
why = "lowering and emission are observed by compiling and running programs: memory semantics, value blocks, units, propagation, generics, the prelude and the object cache"
owns = ["crates/nazm-lir/"]
targets = [
    { package = "nazm-lir", lib = true },
    { package = "nazm-cli", test = "memory" },
    { package = "nazm-cli", test = "value_blocks" },
    { package = "nazm-cli", test = "native_units" },
    { package = "nazm-cli", test = "propagation" },
    { package = "nazm-cli", test = "generics" },
    { package = "nazm-cli", test = "prelude" },
    { package = "nazm-cli", test = "native_cache" },
]

