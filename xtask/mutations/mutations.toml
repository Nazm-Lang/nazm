# Mutation catalogue.
#
# Each entry names a defect the test suite claims to catch. `cargo xtask mutate` applies
# one, rebuilds, runs the suite, and requires it to FAIL — then restores and requires it to
# pass again.
#
# The verification that matters most is that the injection actually landed. Twice during
# development a replacement silently matched nothing (cargo fmt had rewrapped the target),
# the suite passed, and the result was indistinguishable from a surviving mutation. So a
# no-op replacement is now a hard error, not a pass.

[[mutation]]
name = "acceptance-rate-denominator"
why = "divides acceptances by acceptances, pinning every arm's rate at 1.0"
file = "crates/nazm-bench/src/report.rs"
find = "accepted as f64 / counted.len() as f64"
replace = "accepted as f64 / counted.iter().filter(|a| a.is_accepted()).count() as f64"

[[mutation]]
name = "cost-numerator-drops-failures"
why = "sums only successful attempts, so an arm that fails cheaply looks cheap"
file = "crates/nazm-bench/src/report.rs"
find = "let costs: Vec<&crate::cost::Cost> = counted.iter().map(|a| &a.cost).collect();"
replace = "let costs: Vec<&crate::cost::Cost> = counted.iter().filter(|a| a.is_accepted()).map(|a| &a.cost).collect();"

[[mutation]]
name = "missing-cost-becomes-zero"
why = "a dropped usage record silently reads as free"
file = "crates/nazm-bench/src/cost.rs"
find = """                CostComponent::Missing { reason } => {
                    gaps.push((line.to_owned(), reason.clone()));
                }"""
replace = "                CostComponent::Missing { reason: _ } => {}"

[[mutation]]
name = "candidate-fault-becomes-void"
why = "a crashing candidate leaves the denominator, so an unreliable arm looks better"
file = "crates/nazm-bench/src/acceptance.rs"
find = "            Self::CandidateFault { .. } => Outcome::Crash { signal: None },"
replace = "            Self::CandidateFault { reason } => Outcome::HarnessError { reason },"

[[mutation]]
name = "skip-submission-drift-check"
why = "grades a snapshot that changed after it was recorded"
file = "crates/nazm-bench/src/acceptance.rs"
find = "        if let Err(drift) = submission.verify_unchanged() {"
replace = "        if let Err(drift) = Ok::<(), SubmissionDrift>(()) {"

[[mutation]]
name = "compare-against-the-baseline"
why = "credits the language with the entire tooling contribution"
file = "crates/nazm-bench/src/task.rs"
find = "            Self::Nazm => Some(Self::TypescriptTooled),"
replace = "            Self::Nazm => Some(Self::TypescriptBaseline),"

[[mutation]]
name = "void-spend-discarded"
why = "hides money really spent on voided attempts"
file = "crates/nazm-bench/src/report.rs"
find = "    let void_costs: Vec<&crate::cost::Cost> = void.iter().map(|a| &a.cost).collect();"
replace = "    let void_costs: Vec<&crate::cost::Cost> = Vec::new();"

[[mutation]]
name = "primary-metric-drops-void-spend"
why = """
computes the primary cost metric from counted attempts only, which is the defect that
would let an arm spending $8 plus $12 of void work report $0.80 against a comparator's
$1.00 and pass the gate on what is really a 2x cost regression
"""
file = "crates/nazm-bench/src/report.rs"
find = "        total_cost_per_accepted: all_total.per_accepted(accepted),"
replace = "        total_cost_per_accepted: total.per_accepted(accepted),"

[[mutation]]
name = "teardown-order-reversed"
why = """
removes networks and volumes before containers, which a real daemon refuses because a
network with attached endpoints and a volume with a referencing container cannot be
removed -- the ordering bug that leaks an attempt's resources
"""
file = "crates/nazm-bench/src/sandbox/attempt.rs"
find = "            .partition(|r| r.kind == ResourceKind::Container);"
replace = "            .partition(|r| r.kind != ResourceKind::Container);"

[[mutation]]
name = "cleanup-verification-skipped"
why = "reports Clean without checking whether anything survived teardown"
file = "crates/nazm-bench/src/sandbox/attempt.rs"
find = "        if surviving.is_empty() && problems.is_empty() {"
replace = "        if true {"

[[mutation]]
name = "unverifiable-cleanup-passes"
why = """
treats a cleanup that could not be verified as clean, which is the assumption that turns a
detectable instrument fault into a silent independence violation
"""
file = "crates/nazm-bench/src/sandbox/attempt.rs"
find = """                return Disposition::Quarantine {
                    surviving: Vec::new(),
                    reason: format!("cleanup could not be verified: {e}"),
                };"""
replace = "                return Disposition::Clean;"

[[mutation]]
name = "ownership-recorded-after-creation"
why = """
records the intent only after the create returns, reopening the window where an
interruption leaves a resource that nothing knows the name of
"""
file = "crates/nazm-bench/src/sandbox/attempt.rs"
find = """        self.ledger.intend(&self.cfg.attempt, &id)?;
        let created = create(self.engine);"""
replace = """        let created = create(self.engine);
        self.ledger.intend(&self.cfg.attempt, &id)?;"""

[[mutation]]
name = "allocator-ignores-occupied-subnets"
why = "hands out a subnet already in use, including by networks the harness does not own"
file = "crates/nazm-bench/src/sandbox/network.rs"
find = "        if !in_use.iter().any(|s| overlaps(s, &candidate.cidr())) {"
replace = "        if true {"

[[mutation]]
name = "removal-skips-the-ownership-check"
why = """
removes a resource on the strength of the ledger's recorded intention alone, which deletes
a stranger's container whenever a create failed because the name was already taken
"""
file = "crates/nazm-bench/src/sandbox/attempt.rs"
find = "            Ownership::Absent => Ok(true),"
replace = "            Ownership::Absent | Ownership::Foreign { .. } => Ok(true),"

[[mutation]]
name = "recovery-ignores-ownership"
why = "cross-process recovery removes every ledger-claimed name without checking the token"
file = "crates/nazm-bench/src/sandbox/recovery.rs"
find = """                let _ = ledger.disowned(&entry.attempt, id);
                out.foreign.push((id.clone(), found));"""
replace = """                let _ = found;
                let _ = engine.remove(id, true);"""

[[mutation]]
name = "recovery-ignores-dependency-order"
why = """
reconciles in ledger order, so a network is removed while its containers are still
attached -- the engine refuses and the leftovers stay
"""
file = "crates/nazm-bench/src/sandbox/recovery.rs"
find = "        .filter(|e| e.resource.kind == ResourceKind::Container)\n        .chain("
replace = "        .filter(|e| e.resource.kind != ResourceKind::Container)\n        .chain("

[[mutation]]
name = "unknown-ownership-resolves-the-claim"
why = """
clears a ledger claim the engine could not resolve, which is unverified cleanup: the
resource may exist even though the client never learned its id
"""
file = "crates/nazm-bench/src/sandbox/recovery.rs"
find = "                if !resolved {"
replace = "                if false {"

[[mutation]]
name = "ledger-keys-claims-by-engine-id"
why = """
keys outstanding claims by the whole ResourceId, so an Intended entry and its own Created
entry become different rows and every completed attempt looks like it leaked everything
"""
file = "crates/nazm-bench/src/sandbox/ledger.rs"
find = "                    && a.resource.name == b.resource.name"
replace = "                    && a.resource.name == b.resource.name\n                    && a.resource.engine_id == b.resource.engine_id"

[[mutation]]
name = "ledger-claims-not-scoped-to-attempt"
why = """
keys outstanding claims by name alone, so a name reused by a later attempt merges into the
earlier resolved claim and the new resource becomes invisible to recovery
"""
file = "crates/nazm-bench/src/sandbox/ledger.rs"
find = """                a.run == b.run
                    && a.attempt == b.attempt
                    && a.resource.kind == b.resource.kind"""
replace = """                a.resource.kind == b.resource.kind"""


[[mutation]]
name = "candidate-receives-admin-credentials"
why = "hands the superuser password to the candidate alongside its own restricted URL"
file = "crates/nazm-bench/src/sandbox/attempt.rs"
find = """            env: vec![("DATABASE_URL".to_owned(), self.credentials.candidate_url())],"""
replace = """            env: vec![
                ("DATABASE_URL".to_owned(), self.credentials.candidate_url()),
                (
                    "POSTGRES_PASSWORD".to_owned(),
                    self.credentials.superuser_password.clone(),
                ),
            ],"""

# --- the language itself ------------------------------------------------------------
#
# The harness mutations above cover the benchmark's accounting. These cover the
# interpreter, where a silent defect is worse: it changes what programs mean.

[[mutation]]
name = "call-depth-unbounded"
why = """
removes the recursion guard, so runaway recursion exhausts the host stack and kills the
process with no diagnostic — the one failure a tool cannot explain to anyone
"""
file = "crates/nazm-core/src/eval.rs"
find = "                if self.depth > self.max_depth {"
replace = "                if false {"

[[mutation]]
name = "call-depth-never-released"
why = """
leaves the counter raised after a call returns, so a long sequence of sibling calls hits
the depth limit although nothing is nested
"""
file = "crates/nazm-core/src/eval.rs"
find = """                let out = self.call_body(Self::body_of(f)?, &mut call_env, callee);
                self.depth -= 1;"""
replace = """                let out = self.call_body(Self::body_of(f)?, &mut call_env, callee);"""

[[mutation]]
name = "a-returned-value-is-discarded"
why = """
drops the arm that turns a Flow::Return into the call's value, so every `return` reports
that the function finished without producing anything
"""
file = "crates/nazm-core/src/eval.rs"
find = "            Flow::Return(v) | Flow::Fell(Some(v)) => Ok(v),"
replace = """            Flow::Fell(Some(v)) => Ok(v),
            Flow::Return(_) => Err(RuntimeError {
                diagnostic: Box::new(Diagnostic::error(
                    codes::TYPE_MISMATCH,
                    body.span,
                    format!("`{name}` finished without producing a value"),
                )),
            }),"""

[[mutation]]
name = "return-does-not-leave-its-block"
why = """
stops only for `break` and `continue`, so a `return` runs the rest of the block and the
statements after it decide the function's value
"""
file = "crates/nazm-core/src/eval.rs"
find = """            let flow = self.stmt(stmt, env)?;
            if !flow.is_fall_through() {"""
replace = """            let flow = self.stmt(stmt, env)?;
            if matches!(flow, Flow::Break | Flow::Continue) {"""

[[mutation]]
name = "a-diverging-branch-forgets-the-other"
why = """
drops the rule that a branch which returns takes the other branch's type, so
`if c { return 0; } else { 1 }` produces nothing instead of an Int
"""
file = "crates/nazm-core/src/check.rs"
find = "                    (Completion::Diverges, other) | (other, Completion::Diverges) => other,"
replace = """                    (Completion::Diverges, _) | (_, Completion::Diverges) => Completion::Unit,"""

[[mutation]]
name = "remainder-inherits-the-hardware-fault"
why = """
makes `smallest % -1` an overflow error, although its result is 0 and 0 is representable —
the exception the spec exists to remove
"""
file = "crates/nazm-core/src/eval.rs"
find = "            (BinOp::Rem, Int(a), Int(b)) => Ok(Int(a.wrapping_rem(*b))),"
replace = """            (BinOp::Rem, Int(a), Int(b)) => a
                .checked_rem(*b)
                .map(Int)
                .ok_or_else(|| overflow("remainder")),"""

[[mutation]]
name = "negative-literals-not-range-checked"
why = """
folds any digit string after `-` into i64::MIN, so `-9223372036854775809` silently becomes
a different number instead of being refused
"""
file = "crates/nazm-syntax/src/parser.rs"
find = "                    Ok(v) if v == 1u64 << 63 => Some(Expr::Int {"
replace = "                    Ok(_) => Some(Expr::Int {"

[[mutation]]
name = "a-failed-body-drops-the-function"
why = """
restores the cascade: one syntax error inside a body deletes the whole declaration, and
every call to it then reports that the function does not exist
"""
file = "crates/nazm-syntax/src/parser.rs"
find = """        let body = self.block();
        if body.is_none() {
            self.recover_to_item();
        }"""
replace = """        let body = Some(self.block()?);"""

[[mutation]]
name = "nesting-unbounded"
why = """
removes the parser's nesting limit, so a deeply nested tree exhausts the stack in whichever
pass reaches it first — parser, checker, evaluator, or the destructor of the tree — and the
process dies with no diagnostic
"""
file = "crates/nazm-syntax/src/parser.rs"
find = "        if self.depth > MAX_NESTING {"
replace = "        if false {"

[[mutation]]
name = "nesting-counter-never-released"
why = """
counts every construct entered and none left, so nesting becomes a budget for the whole
function and an ordinary flat body of 512 statements is refused as too deep
"""
file = "crates/nazm-syntax/src/parser.rs"
find = """    fn leave(&mut self) {
        self.depth -= 1;
    }"""
replace = """    fn leave(&mut self) {}"""

# Two entries were removed here rather than left failing, because neither described a
# defect the tests could witness:
#
#   nesting-budget-shared-between-functions — dropping the per-item `p.depth = 0` reset
#   survived, and correctly: every successful `enter` is matched by a `leave`, so the
#   counter already returns to zero on its own. The reset is defence against a leak that
#   does not currently exist. `chain-depth-never-unwound` below covers the one path where
#   such a leak is possible, which is the coverage that was actually wanted.
#
#   checking-runs-on-the-callers-stack — parsing on the caller's stack instead of an owned
#   one survived because, with nesting bounded at 512 and the worst shape costing ~14 KB a
#   level, the deepest accepted tree needs about 7 MiB and the CLI's main thread has 8.
#   The weakening is real for a caller with a smaller stack — which is what `parse_source`
#   documents — but stack exhaustion is only observable out of process, and the only
#   out-of-process vehicle here is a binary that happens to have enough. Catalogued as
#   uncovered rather than as caught.

[[mutation]]
name = "chain-depth-never-unwound"
why = """
leaves a binary chain's levels counted after the chain ends, so a function with several
long arithmetic expressions in sequence is refused as too deeply nested
"""
file = "crates/nazm-syntax/src/parser.rs"
find = """        self.unwind(chain);
        Some(lhs)"""
replace = """        Some(lhs)"""

[[mutation]]
name = "chain-depth-not-counted"
why = """
counts only parse recursion, so `1 + 1 + ...` builds a tree nested one level per operator
that nothing bounds — and the checker, evaluator and destructor each walk it until the
stack runs out
"""
file = "crates/nazm-syntax/src/parser.rs"
find = """            if !self.enter() {
                self.unwind(chain);
                return None;
            }
            chain += 1;"""
replace = """            chain += 0;"""

[[mutation]]
name = "a-flow-in-value-position-is-an-error"
why = """
treats a `return` raised inside an expression as a failure instead of propagating it, so
`let x = if c { return 1; } else { 2 };` type-checks and then fails at run time
"""
file = "crates/nazm-core/src/eval.rs"
find = "            left => return Ok(left),"
replace = "            left => return Err($slf.no_value($e)),"

[[mutation]]
name = "stack-not-sized-from-the-budget"
why = """
reserves a fixed stack however large the depth budget is, so `--max-depth` above the
default promises a bound the stack cannot back and the program aborts instead of reporting
"""
file = "crates/nazm-core/src/eval.rs"
find = "    STACK_BASE_BYTES.saturating_add(max_depth.saturating_mul(STACK_BYTES_PER_CALL))"
replace = "    STACK_BASE_BYTES"

