# --- N11: generics and `Vec[T]` -------------------------------------------------------
#
# Retired before it landed: `vec_set` releasing the old element before taking the new one,
# in either compiler. Run twice, serially and uncontended, and survived both times, and the
# reason is that it is **equivalent** under the current rules rather than unobserved: the
# order matters only when the new value's one reference is the slot being replaced, and
# `vec_get` always hands out a reference of its own — so no program can give `vec_set`
# such a value. The order is kept anyway, for the day a borrowed path into a slot exists;
# `vec-get-returns-a-borrowed-element` is the mutation that holds the half that is live.

[[mutation]]
name = "a-parameter-is-read-by-first-position"
why = """
substitution ignores which parameter a use names and gives every one the first argument, so `Pair[Int, Str]`'s second field is an `Int` — parameter order is semantic and this forgets it
"""
file = "crates/nazm-sema/src/generic.rs"
find = "                args.get(p.index as usize).copied().unwrap_or(Type::Int)"
replace = "                args.first().copied().unwrap_or(Type::Int)"

