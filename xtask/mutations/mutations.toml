# --- N38: provenance and information flow ----------------------------------------------------
#
# Each attacks one law of `docs/architecture.md` §7.40 and `docs/spec.md`, *Provenance*: the
# sources are the built-ins that bring data in and output is not input; shared storage is not
# followed and a channel does not drop an origin; a join is a union in any order; a binding keeps
# everything assigned to it; a condition contributes nothing; a callee passes on only what its
# result is computed from; the worklist reaches the fixed point; `main`'s capabilities are the
# runtime's authority and a `spawn` resets nothing; file contents and what is not followed are
# restricted at `write_file`'s path, and a helper — declared or not — carries the rule to its
# callers; the witness reaches the read; a reused module's facts come from its entry, which keeps
# them under `nazm.check/2`; a snapshot and a packet say what the solver knows, under their new
# schemas; and the epoch moved.

