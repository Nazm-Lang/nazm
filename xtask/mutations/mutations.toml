                    Option.Some(value: _) => { },
                    Option.None() => {"""
killers = [{ package = "nazm-cli", test = "selfhost", name = "the_nazm_checker_accepts_the_compiler_it_is_part_of" }]

[[mutation]]
name = "selfhost-a-module-s-own-type-is-not-found"
why = """
the **Nazm-written** checker's type lookup discards the declaration it found, so a module's own record or enum is an unknown type
"""
