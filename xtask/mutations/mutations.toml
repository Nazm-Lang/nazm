# `n39-the-backend-asks-the-resolution-again` is retired by N40: structurally impossible since N40: `nazm-lir` takes no `Resolution` and does not depend on `nazm-cir` (`xtask/src/rules.rs`), and `cargo xtask check`'s core ir boundary refuses either name in it.
