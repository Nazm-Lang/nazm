[[mutation]]
name = "snapshot-skips-the-mode-readback"
why = """
trusts that the mode was applied, so a filesystem that silently refuses bits produces a
snapshot whose permissions differ from the manifest describing it — and every such
submission verifies as drifted for a reason nobody can see
"""
file = "crates/nazm-bench/src/workspace.rs"
