name = "the-loop-reuses-its-first-condition"
why = """
The defect a loop exists to not have. The back edge is redirected from the condition block
to the body block, so the condition is evaluated once, found true, and never looked at
again — every loop that would have terminated runs away.

Nothing structural catches it. The IR is well-formed, every block has a terminator, clang
accepts the module, and `br label %b2` still appears in the emitted text because the block
*before* the loop branches into the condition exactly as it did.

Caught behaviourally by 13 tests, and the distinction between how they catch it is the
point. Nine report a **deadline**, including
`the_condition_is_reevaluated_on_every_iteration`, which runs the compiled program under an
explicit 10-second limit at `-O0` and `-O2` and fails if it has not finished — that test
exists because `nazm build` emits no iteration budget (`docs/spec.md`, *The native
execution contract for loops*), so a suite without deadlines would hang rather than report.
The other four terminate and fail on the **outcome**: their runaway bodies overflow `Int`
within seconds, so the program exits 2 with `N0400` where 0 and a value were expected.
