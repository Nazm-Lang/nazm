replace = "            if false {"

[[mutation]]
name = "a-confirmed-stop-forgets-its-attempt"
why = """
builds the token without naming the attempt it is evidence about, so it vouches for every
workspace equally and the check above can never fire
"""
file = "crates/nazm-bench/src/sandbox/execution.rs"
