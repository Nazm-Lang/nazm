# --- N10.1: a transfer in a value position -------------------------------------------
#
# The Nazm-written compiler had no representation of "this expression left": its checker
# folded a transfer into `unknown`, and its emitter opened every join and emitted every
# node. These put back each half of that, and the two things the audit found alongside it.

# `an-if-is-typed-by-the-branch-that-left` (N10.1) is retired, not lost: N10.2 rewrote the
# `if` join as the reference's three-state one, and the rule it attacked — a branch that
# leaves gives the `if` the other branch's type — is now one line, which
# `a-then-branch-that-leaves-still-gives-the-type` mutates exactly.

[[mutation]]
name = "a-join-no-branch-reached-is-opened-anyway"
why = """
opens an `if`'s join even when both branches left, which is how every join was opened
until N10.1. The block has no predecessor, so it is valid IR — and the parent of the `if`
is emitted into it, popping a value neither branch pushed. `N0405` inside the compiler, or
someone else's value as an operand
"""
file = "compiler/emit.nz"
find = """                            // Only if a branch reached it. Both leaving is the whole `if`
                            // leaving, and what contains it is on no path.
                            if ints_get(joined, p) == 1 {
                                open_block(out, current, live, blk("j", p));
                            }"""
replace = """                            open_block(out, current, live, blk("j", p));"""

[[mutation]]
name = "a-match-join-no-arm-reached-is-opened-anyway"
why = """
the same for a `match` whose every arm left: its join is opened and what contains the
`match` is emitted as though it had a value
"""
file = "compiler/emit.nz"
find = """                            // Opened only if some arm reached it. Otherwise the `match` never
                            // completes and everything after it is on no path.
                            if ints_get(joined, p) == 1 {
                                open_block(out, current, live, blk("j", p));
                            }"""
replace = """                            open_block(out, current, live, blk("j", p));"""

[[mutation]]
name = "an-unreachable-node-is-emitted-anyway"
why = """
takes away the one answer the emitter asks — is the block being written live — so a
call is emitted after one of its arguments left, an assignment stores a value nobody
produced, and an operator runs on half its operands. Every instruction lands after a
terminator
"""
file = "compiler/emit.nz"
find = """fn unreachable_here(live: Ints, kind: Int) -> Bool {
    if ints_get(live, 0) == 1 { return false; }"""
replace = """fn unreachable_here(live: Ints, kind: Int) -> Bool {
    if kind > 0 { return false; }"""

[[mutation]]
name = "an-unreachable-assignment-is-emitted-anyway"
why = """
exempts only assignment from the rule: a `s = if c { continue; } else { break; };` is
emitted though its value never arrives. The one statement whose half-emission changes a
place the program can still read
"""
file = "compiler/emit.nz"
find = """    if kind == n_payload() { return false; }
    true
}"""
replace = """    if kind == n_payload() { return false; }
    if kind == n_assign() { return false; }
    true
}"""

[[mutation]]
name = "an-if-with-one-incoming-reads-two"
why = """
builds every value `if`'s `phi` from two incomings whether or not both branches reached
the join — the fixed count N10 had. The second is a value another construct pushed, named
with a block that is not a predecessor
"""
file = "compiler/emit.nz"
find = """                                                                phi_val, phi_blk, ints_get(nin, k), ints_get(ntype, k)));"""
replace = """                                                                phi_val, phi_blk, 2, ints_get(ntype, k)));"""

[[mutation]]
name = "an-unreachable-nodes-operands-stay-on-the-stack"
why = """
leaves on `vals` what the operands of an unreachable node produced before control
left. Every pop after it is off by those values, so a later, reachable node consumes one
that belongs to a path that no longer exists
"""
file = "compiler/emit.nz"
find = """                while ints_len(vals) > floor { ints_pop(vals); }"""
replace = """                let _kept = floor;"""

[[mutation]]
name = "a-break-out-of-a-scope-does-not-join-it"
why = """
a `break` leaves the `scope` it is inside without waiting for the scope's tasks, which is
what the Nazm-written compiler did from N7 to N10.1: a task that failed is never joined,
its failure is never taken on, and the program prints a value where the reference stops
with the task's diagnostic
