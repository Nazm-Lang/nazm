# --- N12.1: a block used as a value, in the reference backend ------------------------------
killers = [{ package = "nazm-sema", lib = true, name = "module::tests::the_prelude_is_found_by_its_key_wherever_it_sits" }]

[[mutation]]
name = "lowered-arm-block-drops-its-statements"
why = """
an arm written as a block keeps only its tail, so the statements before it — the bindings its tail reads, the effects it has — never run
"""
file = "crates/nazm-lir/src/lower.rs"
find = "                stmts.extend(inner.stmts);"
replace = "                let _ = inner.stmts;"
killers = [{ package = "nazm-cli", test = "value_blocks", name = "a_pattern_binding_returned_through_an_arm_block_outlives_the_scrutinee" }]

[[mutation]]
name = "a-bare-block-is-emitted-as-its-tail-alone"
why = """
a block in a value position emits its tail and skips its statements
"""
file = "crates/nazm-lir/src/emit.rs"
find = "            Expr::Block(b) => self.block(b),"
replace = """            Expr::Block(b) => match &b.result {
                Some(e) => self.expr(e),
                None => Val::Transferred,
            },"""
killers = [{ package = "nazm-cli", test = "value_blocks", name = "a_str_tail_survives_its_local" }]

[[mutation]]
name = "a-block-value-is-released-as-it-leaves"
why = """
the value a block hands on is released as the block ends, before anything has taken it over, so a `Str` or `Vec` tail read from a block local is freed while it is still in use
"""
file = "crates/nazm-lir/src/emit.rs"
find = "            Expr::Block(b) => self.block(b),"
replace = """            Expr::Block(b) => {
                let v = self.block(b);
                if let Val::Of { value, ty } = v {
                    self.release(value, ty);
                }
                v
            }"""
killers = [{ package = "nazm-cli", test = "value_blocks", name = "a_str_tail_survives_its_local" }]

[[mutation]]
name = "a-statement-block-is-skipped"
why = """
a block written as a statement lowers to nothing, so its assignments never happen
"""
file = "crates/nazm-lir/src/lower.rs"
find = "        AstExpr::Block(b) => lower_body(ctx, b),"
replace = "        AstExpr::Block(_) => (Vec::new(), Ends::FallsThrough),"
killers = [{ package = "nazm-cli", test = "value_blocks", name = "a_statement_match_whose_arms_produce_nothing_assigns_in_place" }]

[[mutation]]
name = "a-statement-match-claims-every-arm-leaves"
why = """
a statement `match` is said to transfer even when an arm falls through, so everything written after it is dropped from the function
"""
file = "crates/nazm-lir/src/lower.rs"
find = """        if ends == Ends::FallsThrough {
            every_arm_leaves = false;
        }"""
replace = "        let _ = ends;"
killers = [{ package = "nazm-cli", test = "memory", name = "a_matched_sequence_handle_is_the_one_it_names" }]

[[mutation]]
name = "a-statement-match-arm-does-not-rejoin"
why = """
a statement `match` arm that falls through never branches to the continuation, leaving its block without a terminator
"""
file = "crates/nazm-lir/src/emit.rs"
find = """            if self.stmts(&arm.body) == Reach::FallsThrough {
                let _ = writeln!(self.out, "  br label %{cont}");
                arrives = true;
            }"""
replace = """            if self.stmts(&arm.body) == Reach::FallsThrough {
                arrives = true;
            }"""
killers = [{ package = "nazm-cli", test = "memory", name = "a_matched_sequence_handle_is_the_one_it_names" }]

[[mutation]]
name = "a-statement-match-never-lets-go-of-what-it-matched"
why = """
a statement `match` stops holding its scrutinee at the continuation without releasing it, so an owning scrutinee leaks every time an arm falls through
"""
file = "crates/nazm-lir/src/emit.rs"
find = """        self.open(&cont);
        self.release_matched(scrutinee_ty, slot);
        Reach::FallsThrough"""
replace = """        self.open(&cont);
        self.building.pop();
        Reach::FallsThrough"""
killers = [{ package = "nazm-cli", test = "value_blocks", name = "a_statement_match_whose_arms_produce_nothing_assigns_in_place" }]

[[mutation]]
name = "an-emitted-block-uses-its-tail-after-a-transfer"
why = """
a block whose statements transfer still emits its tail, treating `Diverges` as a value: instructions after a terminator, and a value on a path that never arrives
"""
