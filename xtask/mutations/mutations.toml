[[mutation]]
name = "selfhost-a-block-operand-loses-its-span"
why = """
the **Nazm-written** parser gives a block operand an empty span, so an expression built on it spans the wrong bytes
"""
file = "compiler/parse.nz"
find = """                emit(nk, nar, nst, nen, ntx, n_blockexpr(), 1, start, close, "");
                ints_push(vs, start);
                ints_push(ve, close);"""
replace = """                emit(nk, nar, nst, nen, ntx, n_blockexpr(), 1, start, close, "");
                ints_push(vs, start);
                ints_push(ve, start);"""
killers = [{ package = "nazm-cli", test = "selfhost", name = "the_nazm_parser_produces_the_same_tree_as_the_reference" }]

[[mutation]]
name = "selfhost-a-statement-block-needs-a-semicolon"
why = """
the **Nazm-written** parser does not treat a statement that starts with `{` as block-like, so a block followed by another statement is refused
"""
file = "compiler/parse.nz"
find = "        if t == k_lbrace() { blocklike = 1; }"
replace = "        if t == k_lbrace() { blocklike = 0; }"
killers = [{ package = "nazm-cli", test = "selfhost", name = "the_nazm_parser_produces_the_same_tree_as_the_reference" }]

[[mutation]]
name = "selfhost-every-block-expression-is-a-value"
why = """
the **Nazm-written** checker gives a block written as an expression a value whatever its block completes with, so a `Unit` block is accepted where a value is needed
"""
