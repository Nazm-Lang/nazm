# `n13-native-the-left-temporary-leaks` is retired by N40: equivalent under MIR for the reason `a-string-comparison-keeps-its-operands` is: the cleanup stack drops an operand temporary at its region's end.

# `n13-native-the-right-temporary-leaks` is retired by N40: equivalent under MIR, as `n13-native-the-left-temporary-leaks`.
[[mutation]]
name = "n13-native-operands-are-released-before-they-are-compared"
why = """
the temporaries are released before the helper reads them, so a string payload is compared after its storage was freed — a real use-after-free, not an equivalent mutant
Repointed by N40: a comparison borrows its operand temporaries and gives them back after; the validator refuses the read of an emptied one.
"""
file = "crates/nazm-mir/src/lower.rs"
find = """                let (a, b) = two(ops);
                self.write(
                    dst,
                    Rvalue::Compare {"""
replace = """                let (a, b) = two(ops);
                self.release_all(held.clone(), at);
                self.write(
                    dst,
                    Rvalue::Compare {"""
profile = "native"
no_killer = "a known surviving mutant (campaign 418a5e5921b866cc: SURVIVED at the workspace suite). Nothing allocates between the early release and the helper's read, so the freed bytes are still there and every answer and memory counter is right; glibc 2.41 in the contained image ignores MALLOC_PERTURB_ and glibc.malloc.perturb (measured with a C probe), so no deterministic direct killer exists under the supported allocator and harness. A test-detection gap: it needs freed storage poisoned, which no supported configuration does"

