[package]
name = "xtask"
description = "Repository automation and architectural gates."
version.workspace = true
edition.workspace = true
# Not `workspace = true`. The workspace floor (1.85) is the oldest compiler the *shipped*
# crates need; this one is a development tool and needs `std::fs::File::try_lock`, which
# stabilised in 1.89. Declaring it here keeps the library crates' floor where it belongs
# instead of raising it for a tool nobody builds against.
rust-version = "1.89"
license.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# The mutation campaign's identity and its journal digests. A journal is a verdict cache,
# and the reason `architecture.md` §8 gives for BLAKE3 over a checksum applies to it: an
# accidental collision would reuse a verdict for a tree it was never measured against.
# Already in the lockfile through `nazm-cache`, with the same pure-Rust feature set.
blake3 = { workspace = true }
# The documentation corpus gate (N32) reads the corpus with the reader `nazm docs` uses, so
# the two cannot disagree. It depends on no compiler crate.
nazm-docs = { workspace = true }

# Only for tests: the restoration and lifecycle tests build throwaway trees to
# interrupt and repair, and they must never touch the real checkout.
[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
